<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2c3e50">
    <meta name="format-detection" content="telephone=no">
    <!-- 内容安全策略：脚本/样式仍为内联（单文件应用，无构建），但把"能往哪发请求"收窄。
         connect-src 是白名单：任何第三方注入的脚本都无法把数据外发到别的域。
         media/img 放宽为 https: —— 音频地址由镜像 302 到网易云 CDN，域名不固定，
         硬列白名单会把播放打断；这两项本来也不是数据外发通道。
         若某天新增了音源域名，控制台会明确报 CSP 拦截，把域名加进 connect-src 即可。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self';
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline';
          img-src * data: blob:;
          media-src * blob: data:;
          connect-src 'self' https://api.qijieya.cn https://api.injahow.cn https://music-api.gdstudio.xyz https://music.163.com https://*.music.126.net;
          object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>燕子音乐</title>
    <link rel="shortcut icon" href="cnm.sb.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; background: #2c3e50; }
        body {
            font-family: 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%);
            /* 固定单屏：整页不再滚动，标题栏 / 搜索行永远可见，歌单只在 .p-list 内部滚动。
               电视模式原本就是这样，现在 PC 网页与手机 APP 也统一（旧布局靠 .p-fixed 吸顶，
               一滚动就把头部顶出视口，真机反馈为"头部被隐藏"）。 */
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* v1.14：左右内边距归零，让所有区块横向铺满屏幕、消除两侧蓝色竖条。
               v1.15：底部内边距也归零，白色卡片一直铺到屏幕底边（"底部也铺满"）。
               原先排在卡片后面的 #status 提示行会占掉约 28px 并露出蓝色渐变带，
               现已改为不占文档流的底部浮层弹窗（见 .status）。
               呼吸空间改由 .topbar / .hint 自身的 padding 提供；
               v1.18 起 .change-wrap 搜索行整行贴边铺满，不再留左右内边距。 */
            padding: 14px 0 0;
        }
        .cover {
            width: 48px; height: 48px;
            border-radius: 50%; overflow: hidden;
            border: 3px solid rgba(255,255,255,.4);
            box-shadow: 0 4px 14px rgba(0,0,0,.35);
            background: #fff; flex: 0 0 48px;
        }
        .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .title { font-size: 22px; color: #fff; font-weight: 800; text-align: center;
                 text-shadow: 0 4px 15px rgba(0,0,0,.4); letter-spacing: 2px; }
        .topbar {
            width: 100%; max-width: 900px;
            display: flex; align-items: center;
            flex: 0 0 auto; margin-bottom: 10px;
            padding: 0 14px;   /* body 左右 padding 归零后，由此保证封面/标题不贴屏幕边 */
        }
        .topbar > * + * { margin-left:12px; }
        .topbar .title { margin: 0; }
        /* v1.18：搜索行「三端全部铺满」—— 去掉 900px 居中限宽，width:100% 即整屏宽度，
           手机 / PC / 电视三个控件都一路贴到屏幕左右边。
           v1.16 只让手机铺满、PC/电视还保留 900px 限宽，本次按反馈统一取消。
           注意：这里只改搜索行；.topbar / .hint 与白色卡片内的 900px 内容列仍保持居中限宽。
           交叉轴 stretch 让三控件等高，输入框与按钮拼接处不会错开 1~2px。 */
        .change-wrap {
            width: 100%; max-width: none;
            flex: 0 0 auto; margin-bottom: 10px;
            display: flex; align-items: stretch;
            padding: 0;
        }
        .change-wrap > * + * { margin-left:8px; }
        /* v1.16「搜索框与搜歌无缝拼接」：去掉两者之间的间距，相接一侧的圆角拉直，
           白色输入框 + 绿色按钮拼成一个左右带圆角的整体搜索控件（input-group 效果）。
           ID 选择器特异性高于上面的 .change-wrap > * + *，
           手机媒体查询里 6px 的间距规则同样被它覆盖，三端都无缝。 */
        #playlistId + .change-btn { margin-left: 0; }
        /* 三个控件之间是 8px 间距，却按"无缝拼合"的方式分配圆角（左圆 + 方 + 右圆），
           中间的直角落在空隙里就成了悬空的方角。各自独立圆角更干净，也不依赖拼接顺序。 */
        /* v1.13 搜索行重排：榜单名去掉「云音乐」前缀后只剩 3 个字，让出的宽度主要给输入框。
           v1.16：按反馈把排行榜下拉适当加宽（110→128px / 手机 66→84px），
           保证「飙升榜 ▾」和占位项「排行榜...」都完整显示、不被挤省略；
           输入框仍由 flex:1 自动吃满剩余空间，三端共用这一套基准。 */
        #playlistId { flex: 1; min-width: 0; padding: 8px 10px; border: none; font-size: 14px; outline: none;
                      border-radius: 0; background: #fff; color: #333; }
        #boardSel { padding: 8px 8px; border: none; font-size: 14px; outline: none;
                    border-radius: 8px 0 0 8px; background: #fff; color: #333;
                    flex: 0 0 128px; min-width: 0; }
        .change-btn { padding: 8px 14px; border: none; background: linear-gradient(45deg,#4CAF50,#8BC34A);
                      color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; white-space: nowrap;
                      border-radius: 0 8px 8px 0; }
        .hint { width: 100%; max-width: 900px; font-size: 11px; color: rgba(255,255,255,.6);
                flex: 0 0 auto; margin-bottom: 10px; text-align: center; padding: 0 8px; }
        /* v1.14 铺满：白色卡片横向贴边（消除两侧蓝色竖条），圆角与外发光随之去掉，
           否则四角会重新露出蓝色背景。内部内容统一收进 900px 居中列（见下方 .p-fixed > * / .p-list）。 */
        .player-card {
            width: 100%; max-width: none;
            background: #fff; border-radius: 0;
            box-shadow: none;
            flex: 1 1 auto; min-height: 0;
            display: flex; flex-direction: column; overflow: hidden;
        }
        /* 卡片 14px 圆角由 .player-card 自己绘制，.p-fixed 是不透明白底又紧贴卡片顶部，
           会盖掉左右两个上圆角（真机表现为"上面两角是直角、下面两角是圆的"），这里补上部圆角。
           v1.8：不再用 sticky 吸顶 —— 旧布局整页滚动时 .p-fixed 吸顶会把标题栏 / 搜索行
           顶出视口（"隐藏头部"）。现在整页固定单屏，.p-fixed 常驻卡片顶部，.p-list 自己滚动。 */
        .p-fixed { position: static; flex: 0 0 auto; background: #fff; border-radius: 0; }
        /* v1.14 内容列：白色卡片铺满屏幕，但内部内容收进 900px 居中列，
           PC / 电视上歌名、歌词、按钮、歌单不会被拉散；手机 390px 下 900 上限不生效，等于纯铺满。
           用 margin:auto 而非 align-items，避免影响 flex 列的高度分配与电视 layoutTvList。 */
        .p-fixed > *, .p-list { width: 100%; max-width: 900px; margin-left: auto; margin-right: auto; }
        .p-main { display: flex; align-items: center; padding: 14px; background: #fff; }
        .p-pic { width: 90px; height: 90px; border-radius: 50%; overflow: hidden;
                 background: #eee url('11.jpg') center/cover; flex: 0 0 90px; margin-right: 14px;
                 box-shadow: 0 4px 12px rgba(0,0,0,.2);
                 border: 3px solid #fff; position: relative; }
        .p-pic img { width: 100%; height: 100%; object-fit: cover; display: block;
                     border-radius: 50%; }
        .p-pic.playing { animation: spin 8s linear infinite; }
        .p-pic.paused { animation: none; }
        /* 所有封面地址都取不到时的占位：给一个音符底色，而不是让圆形区域空成灰洞 */
        .p-pic.no-cover { background: linear-gradient(135deg,#eef3ef,#dbe7de); }
        .p-pic.no-cover::after { content: '♪'; position: absolute; inset: 0; display: flex;
                                 align-items: center; justify-content: center;
                                 color: #9fb3a6; font-size: 30px; line-height: 1; }
        body.tv .p-pic.no-cover::after { font-size: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .p-info { flex: 1; min-width: 0; }
        .p-name { font-size: 16px; font-weight: 700; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-artist { font-size: 13px; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* 歌词窗口高度恒定：超长句只在容器内部滚动 / 由 JS 自动缩字号，绝不把容器撑高。
           旧实现按句子高度动态改 max-height，每帧重排会让下方控制区与歌单反复跳动（"闪"），
           句子极长时还会把整块 .p-fixed 顶出卡片（"撑破容器"）。
           v1.11：height 取「行盒 24px 的整数倍 + 1px 上边框」，让 clientHeight 恰为 24 的整数倍；
           配合 JS 把 scrollTop 吸附到行顶，容器上下边缘都落在行与行之间的空隙，
           汉字不会被横向裁成上下两半。v1.12 手机窗口调大到 5 行后，三端对应 6 / 5 / 5 行。 */
        .p-lrc { position: relative; background: linear-gradient(180deg,#f7f7f9,#f0f4f0); padding: 6px 14px;
                 height: 145px; min-height: 0; max-height: none;
                 overflow-y: auto; overscroll-behavior: contain;
                 text-align: center; border-top: 1px solid #eee;
                 /* 上下 12px 渐隐：极端长句换行、边缘仍压到字时，被裁的半截汉字会淡出，
                    不会出现生硬的「上下两半」。mask 相对容器固定、不随内容滚动；
                    老 WebView 不支持时自动退化为无渐隐，其余修复仍生效。 */
                 -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
                 mask-image: linear-gradient(180deg, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%); }
        /* 只分两种字号：非当前句 12px、当前句 14px（稍大）。near / far 只改颜色与透明度。
           行高固定 20px + 上下各 2px padding = 24px 整数行盒：旧的 1.45 倍数会算出
           18.85 / 23.2px 小数行高，滚动裁剪线落在汉字中间，出现「上下两半」。
           字号缩小不改变行盒高度，整数倍对齐机制（v1.11 防切字）保持成立。 */
        .lrc-line { color: #b8b8b8; font-size: 12px; line-height: 20px; padding: 2px 0; transition: color .4s, opacity .4s, font-size .4s;
                    white-space: normal; word-break: break-word; }
        .lrc-line.cur { color: #2e7d32; font-size: 14px; font-weight: 700; line-height: 20px;
                        text-shadow: 0 2px 12px rgba(46,125,50,.25);
                        opacity: 1; }
        .lrc-line.near { color: #999; opacity: .75; }
        .lrc-line.far { color: #ccc; opacity: .45; }
        .lrc-ctrl {
            display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
            padding: 4px 14px; background: #fafafa; border-top: 1px solid #eee;
            font-size: 12px; color: #999;
        }
        .lrc-btn {
            width: 26px; height: 26px; border: none; border-radius: 50%;
            background: #e8f5e9; color: #2e7d32; font-size: 14px; font-weight: 700;
            cursor: pointer; margin: 0 4px; outline: none; line-height: 1;
        }
        .lrc-btn:hover { background: #4CAF50; color: #fff; }
        .lrc-btn.wide { width: auto; padding: 0 8px; border-radius: 12px; font-size: 11px; white-space: nowrap; }
        .lrc-off { min-width: 56px; text-align: center; color: #4CAF50; font-weight: 700; }
        .lrc-tip { margin-left: 8px; color: #bbb; }
        .p-ctrl { padding: 0 14px 14px; }
        /* v1.9.1：列表上方的「# / 歌名 / 歌手」表头已按需求删除，
           连带移除为它做滚动条对齐的 syncListGutter()（已无对齐对象）。
           .p-list 顶部 10px 内边距仍保留，用于给置顶行的焦点框留白。 */
        .p-progress {
            display: flex; align-items: center; font-size: 12px; color: #999;
            margin-bottom: 6px;
        }
        .p-progress > * + * { margin-left:10px; }
        .p-bar { flex: 1; height: 5px; background: #e5e5e5; border-radius: 3px; cursor: pointer; position: relative; }
        /* 命中区扩展：进度条本体只有 5px 高，手指/遥控器都难以点中。
           用伪元素上下各撑 9px，视觉不变、可点区域变 23px。 */
        .p-bar::before { content: ''; position: absolute; left: 0; right: 0; top: -9px; bottom: -9px; }
        .p-bar-played { height: 100%; background: linear-gradient(45deg,#4CAF50,#8BC34A); border-radius: 3px; width: 0; }
        .p-btns {
            display: flex; align-items: center;
        }
        .p-btns > * + * { margin-left:6px; }
        .p-btn { width: 38px; height: 38px; border: none; border-radius: 50%; background: #f0f0f0;
                 color: #333; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
                 transition: background .2s; outline: none; padding: 0; }
        .p-btn:hover { background: #4CAF50; color: #fff; }
        .p-btn.play { width: 46px; height: 46px; background: linear-gradient(45deg,#4CAF50,#8BC34A); color: #fff; font-size: 18px; }
        .p-btn.vol { font-size: 14px; }
        /* ===== 图标：内联 SVG，不用 emoji =====
           原来用 ⏮⏸▶⏭🔊🔁🔂🎲☰ 这些字符，依赖系统 emoji 字体。精简电视盒子/定制 ROM 上
           没有彩色 emoji 字体，渲染成空方框（实测 🔁 就是一个豆腐块），中远距离完全看不出功能。
           SVG 用 currentColor 跟随按钮文字色，尺寸固定，任何设备一致。
           多图标共用一个按钮时用状态类切换，避免 JS 到处改 innerHTML。 */
        .p-btn .ico { width: 20px; height: 20px; display: block; fill: currentColor; }
        .p-btn.play .ico { width: 24px; height: 24px; }
        .p-btn .ico-pause, .p-btn .ico-vol-off { display: none; }
        .p-btn.is-playing .ico-play { display: none; }
        .p-btn.is-playing .ico-pause { display: block; }
        .p-btn.is-muted .ico-vol-on { display: none; }
        .p-btn.is-muted .ico-vol-off { display: block; }
        .mode-btn .ico { display: none; }
        .mode-btn[data-mode="0"] .ico-repeat-all { display: block; }
        .mode-btn[data-mode="1"] .ico-repeat-one { display: block; }
        .mode-btn[data-mode="2"] .ico-shuffle { display: block; }
        .p-spacer { flex: 1; }
        .p-list { flex: 1 1 auto; min-height: 90px; max-height: none;
                  overflow-y: auto; overscroll-behavior: contain; border-top: 1px solid #eee;
                  padding: 10px 6px 6px; }   /* 顶部留 10px：置顶行的 outline(2px)+offset(2px) 不会被裁 */
        .p-list .li { display: flex; align-items: center; padding: 9px 14px; cursor: pointer;
                      border-bottom: 1px solid #f5f5f5; transition: background .15s; outline: none; }
        .p-list .li:hover { background: #f5faf5; }
        .p-list .li.cur { background: #e8f5e9; }
        .p-list .li .idx { width: 34px; color: #bbb; font-size: 12px; flex: 0 0 34px; }
        .p-list .li.cur .idx { color: #4CAF50; font-weight: 700; }
        .p-list .li .nm { flex: 1; min-width: 0; font-size: 14px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-list .li.cur .nm { color: #2e7d32; font-weight: 700; }
        .p-list .li .ar { width: 90px; flex: 0 0 90px; text-align: right; font-size: 12px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* 列表显示/隐藏：折叠时连表头一起收起，卡片收缩到内容高度（不留半截白底）。
           标题栏 / 搜索行属于 body 直接子元素，始终常驻，不受折叠影响。
           用 body 上的类统一控制，避免内联样式与电视模式 layoutTvList 的固定高度互相打架。 */
        body.list-hidden .p-list { display: none; }
        /* body.tv .player-card 在后面用同样的特异性写了 flex:1 1 auto，
           必须再加一条更高特异性的规则，否则电视上折叠后卡片仍撑满整屏。 */
        body.list-hidden .player-card,
        body.tv.list-hidden .player-card { flex: 0 1 auto; }
        body.list-hidden .p-fixed { border-radius: 0; }
        .list-btn { flex: 0 0 auto; }
        body.list-hidden .list-btn { background: #e8f5e9; color: #2e7d32; }
        /* ===== v1.15 底部提示弹窗 =====
           原来 #status / #errorCard 是 body 文档流里排在卡片后面的两行：即使没有提示，
           #status 的 min-height:20px + margin-top:8px 也会占掉约 28px，加上 body 底部
           padding 12px，就在白色卡片下方留出一条蓝色渐变带 —— 截图里"底部没铺满"就是它。
           现在两者统一改成固定在屏幕底部的浮层弹窗：position:fixed 不占布局高度，
           卡片得以一直铺到屏幕底边。提示由 .show 类弹出（上滑 + 淡入），6 秒后自动收起。
           pointer-events:none 保证弹窗不挡列表点击、不抢遥控器焦点；
           z-index 1200 高于换词弹层的 999，弹层打开时的提示也能看见；
           bottom 额外加 env(safe-area-inset-bottom) 避开全面屏手势条，老 WebView
           不认识该值时自动回退到上一行 bottom:16px。 */
        .status {
            position: fixed; left: 50%; bottom: 16px;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            transform: translate(-50%, 14px);
            width: calc(100% - 32px); max-width: 520px;
            min-height: 0; margin: 0; padding: 11px 18px;
            border-radius: 14px;
            background: rgba(28, 40, 46, .94); color: #fff;
            font-size: 13px; line-height: 1.55; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,.32);
            z-index: 1200; pointer-events: none;
            opacity: 0; visibility: hidden;
            transition: opacity .22s ease, transform .22s ease, visibility .22s;
        }
        .status.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
        /* 错误提示复用同一个弹窗，只换红底：两个浮层叠在同一位置会互相遮挡 */
        .status.err { background: rgba(150, 38, 38, .96); }

        .picker-mask {
            position: fixed; left: 0; top: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,.55); display: none; z-index: 999;
            align-items: center; justify-content: center; padding: 20px;
        }
        .picker-mask.show { display: flex; }
        .picker-box {
            width: 100%; max-width: 460px; max-height: 70vh;
            background: #fff; border-radius: 12px; overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,.5);
        }
        .picker-head {
            padding: 12px 16px; font-size: 15px; font-weight: 700; color: #2e7d32;
            border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between;
        }
        .picker-close {
            border: none; background: transparent; font-size: 20px; color: #999;
            cursor: pointer; width: 30px; height: 30px; border-radius: 50%; outline: none;
        }
        .picker-close:hover { background: #f0f0f0; color: #333; }
        /* v1.7.8：滚动容器必须留内边距，否则行是满宽的、焦点框（outline 2px + 2px 间隙）
           在容器左右边缘会被 overflow 裁掉，真机表现就是"框线只有上下两条、左右缺失"。
           6px 内边距足够容纳 4px 的外扩，框线四边都能完整显示。 */
        .picker-list { overflow-y: auto; flex: 1; padding: 6px; }
        .picker-item {
            padding: 10px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer;
            outline: none;
        }
        .picker-item:hover { background: #e8f5e9; }
        .picker-item .pn { font-size: 14px; color: #222; font-weight: 600;
                            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* 换词候选的序号：固定宽度，序号与歌名视觉分离，长歌名仍走 ellipsis */
        .picker-item .pno { display: inline-block; min-width: 24px; color: #4CAF50; font-weight: 700; }
        .picker-item .pt { color: #222; }
        .picker-item .pa { font-size: 12px; color: #888; margin-top: 2px;
                            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .picker-foot { padding: 10px 16px; border-top: 1px solid #eee; text-align: center; }
        .picker-foot button {
            padding: 6px 14px; border: none; border-radius: 8px; font-size: 13px;
            background: #f0f0f0; color: #333; cursor: pointer; margin: 0 4px; outline: none;
        }
        .picker-foot button.primary { background: linear-gradient(45deg,#4CAF50,#8BC34A); color: #fff; }
        .picker-foot button:hover { opacity: .9; }
        /* 弹窗内的"输入歌曲ID"模式：替代原生 prompt()。
           prompt() 需要宿主实现 WebChromeClient.onJsPrompt()，没实现的壳里直接返回 null，
           功能静默失效；电视上更是连输入法都调不出来。 */
        .picker-body { padding: 14px 16px; flex: 1; overflow-y: auto; }
        .picker-body .pb-tip { font-size: 12px; color: #888; line-height: 1.7; margin-bottom: 10px; }
        .picker-body input {
            width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #ddd;
            border-radius: 8px; outline: none; color: #333; background: #fff;
        }
        .picker-body input:focus { border-color: #4CAF50; box-shadow: 0 0 0 3px rgba(76,175,80,.18); }

        @media (max-width:600px){
            /* v1.18：铺满（max-width:none / padding:0）与两端直角已上移到基准、三端统一，
               这里只保留窄屏专属差异：间距 8→6px、按钮内边距与字号各减一档、下拉 128→84px。
               输入框与「搜歌」仍无缝拼接，排行榜与它们之间保留 6px 间距。 */
            .change-wrap > * + * { margin-left: 6px; }
            #playlistId { flex: 1 1 auto; min-width: 0; padding: 8px 9px; }
            #boardSel { flex: 0 0 84px; min-width: 0; font-size: 12px; padding: 8px 3px; }
            .change-btn { padding: 8px 8px; font-size: 12px; flex: 0 0 auto; }
            .lrc-tip { display: none; }
            /* 手机 APP 歌词窗口稍微调大：121px = 5×24 行盒 + 1px 上边框，显示 5 行
               （比 v1.11 的 4 行多一行）。仍取行盒整数倍，clientHeight=120 恰为 5×24，
               上下边缘依旧落在行间隙，不会把汉字切成两半；高度恒定，不随内容变化。 */
            .p-lrc { height: 121px; }
            .p-list .li .ar { width: 60px; flex-basis: 60px; font-size: 11px; }
            .p-list .li .idx { width: 32px; flex-basis: 32px; }
        }
        /* 极矮视口（手机横屏 / PC 小窗口）：固定单屏会把歌单压没，退回整页滚动。
           电视模式由 body.tv / body.tv .p-list 的高优先级规则覆盖，不受影响。 */
        @media (max-height: 620px){
            body { height: auto; min-height: 100vh; overflow: auto; }
            .player-card { flex: 0 0 auto; }
            .p-list { flex: 0 0 auto; min-height: 0; max-height: 260px; }
        }

        /* ===== 焦点框线：非电视端（手机 APP + PC 网页）一律不显示；电视端只认 .tv-focus 类 ===== */
        /* v1.17 曾给桌面键盘导航留一条 @media (hover:hover)(pointer:fine) + :focus-visible
           琥珀黄辅助框，但 Chromium 对 <input type=text> / <select> 的 :focus-visible 判定
           与「是否键盘操作」无关 —— 鼠标点击搜索框、排行榜同样命中，于是 PC 网页端点这两个
           控件仍会出现焦点框线（用户第二次反馈）。v1.19 彻底移除该媒体查询：
           非电视端任何聚焦方式（鼠标点击 / Tab / WebView 自动聚焦）都不画 outline。
           刻意拆成两条独立规则：老 WebView 不认识 :focus-visible 时只会丢弃第二条，
           第一条仍生效（写在同一条选择器列表里会整条作废）。
           !important 用于压过部分 WebView 把 UA 焦点环写进作者层的情况；
           body:not(.tv) 限定保证电视端 .tv-focus 的琥珀黄遥控器焦点环不受影响。 */
        body:not(.tv) *:focus { outline: none !important; }
        body:not(.tv) *:focus-visible { outline: none !important; }
        /* 电视模式：真实焦点一律不画框（含 WebView 自动聚焦的输入框），框线只认 .tv-focus 类 */
        body.tv button:focus, body.tv #playlistId:focus, body.tv #boardSel:focus,
        body.tv #lrcIdInput:focus,
        body.tv .li:focus, body.tv .picker-item:focus, body.tv .change-btn:focus,
        body.tv #bar:focus, body.tv .lrc-btn:focus {
            outline: none;
        }
        /* 防御：电视模式下歌词显示文本区即便被原生焦点偶然触及，也不显示焦点环；工具栏按钮仍可聚焦 */
        body.tv .p-lrc:focus, body.tv .p-lrc *:focus {
            outline: none;
        }

        /* 电视 / 盒子固定单屏布局：整页禁止滚动，固定控制区压缩，歌单高度由 JS 按视口精确分配 */
        body.tv {
            position: fixed; left: 0; top: 0; right: 0; bottom: 0;
            height: 100%;
            background: linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%);
            overflow: hidden;
            padding: 8px 0 0;   /* v1.15 底部归零：白色卡片铺到屏幕底边，不再留蓝色带 */
        }
        body.tv .topbar { height: 44px; margin-bottom: 6px; flex: 0 0 44px; }
        body.tv .topbar .cover { width: 44px; height: 44px; flex: 0 0 44px; border-width: 2px; }
        body.tv .title { font-size: 24px; }
        body.tv .change-wrap { height: 44px; margin-bottom: 6px; flex: 0 0 44px; }
        body.tv .hint { display: none; }
        body.tv #playlistId, body.tv #boardSel, body.tv .change-btn {
            font-size: 15px; padding: 8px 12px; height: 44px;
        }
        body.tv .player-card {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        body.tv .p-fixed { position: static; flex: 0 0 auto; min-height: 0; }
        body.tv .p-main { padding: 6px 12px; }
        body.tv .p-pic { width: 54px; height: 54px; flex: 0 0 54px; margin-right: 10px; }
        /* 三端统一恒定高度：短句留白、长句内部滚动，切句时歌词容器以下绝不跳动。
           电视卡片由 JS 按视口分配固定高度；121px = 5×24 行盒 + 1px 上边框，边缘不切字。 */
        body.tv .p-lrc { height: 121px; min-height: 0; max-height: none; padding: 5px 12px; }
        /* 字号与行高跟随全局两档规则（非当前 12px / 当前 14px、行高固定 20px），电视端不再另设一套 */
        body.tv .lrc-ctrl { flex-wrap: nowrap; justify-content: center; padding: 2px 10px; }   /* 不用 flex gap：Chrome<84 不生效，按钮自身 margin 已足够 */
        body.tv .p-ctrl { padding: 0 12px 6px; }
        body.tv .p-progress { margin-bottom: 4px; }
        body.tv .p-btn { width: 44px; height: 44px; font-size: 16px; }
        body.tv .p-btn.play { width: 52px; height: 52px; font-size: 20px; }
        body.tv .lrc-btn { width: 32px; height: 32px; font-size: 15px; margin: 0 3px; }
        /* v1.7.8：必须显式写 width:auto。body.tv .lrc-btn 的 width:32px 优先级 (0,2,1)
           高于 .lrc-btn.wide 的 width:auto (0,2,0)，导致"换词/下载"被压成 32px 宽，
           而 padding:0 10px 又占掉 20px，文字只剩 12px 可用 → 文字从右侧溢出，
           视觉上就是"文字在框线里偏右、不居中"。 */
        body.tv .lrc-btn.wide { width: auto; min-width: 46px; height: 32px; font-size: 11px; padding: 0 10px; border-radius: 14px; }
        body.tv .lrc-off { min-width: 48px; margin: 0 2px; }
        body.tv .p-name { font-size: 16px; }
        body.tv .p-artist { font-size: 13px; }
        body.tv .p-list {
            flex: 1 1 auto;
            min-height: 120px;
            max-height: none;
            overflow-y: auto;
        }
        /* v1.15 电视端提示弹窗：盒子有过扫描(overscan)，底边上移 + 字号放大，
           保证远距离能看清提示且不会被屏幕边缘裁掉 */
        body.tv .status {
            bottom: 34px; bottom: calc(34px + env(safe-area-inset-bottom, 0px));
            max-width: 760px; font-size: 17px; padding: 14px 26px;
        }
        body.tv .p-list .li { padding: 9px 16px; }
        body.tv .p-list .li .idx { width: 52px; flex: 0 0 52px; font-size: 14px; }
        body.tv .p-list .li .nm { font-size: 16px; }
        body.tv .p-list .li .ar { font-size: 13px; }
        body.tv .picker-item { padding: 14px 18px; }
        body.tv .picker-item .pn { font-size: 16px; }
        body.tv .picker-item .pa { font-size: 13px; }
        body.tv .picker-foot button { padding: 10px 20px; font-size: 14px; }

        /* ===== 电视焦点环：全站统一琥珀黄 #FFB300 =====
           页面主体是绿色渐变、主要按钮也是绿色，焦点环若用绿色会和控件本身糊在一起
           （v1.7 搜歌按钮"看不见焦点"就是这个原因）。统一换成琥珀黄：
           在深绿底、白底输入框、绿色按钮上都有明显色差，中远距离也一眼可辨。
           注意：这里刻意不使用 CSS 变量 var()，部分电视盒子 WebView 版本较老不支持。 */
        /* v1.7.4：只保留一条细外框线 —— 所有控件完全相同
           （outline 2px 琥珀黄 + 2px 间隙）。不加 border（否则变双框）、
           不加外发光（视觉上像一圈背景色）、不声明 background（保持控件自身底色不变）。 */
        /* v1.7.7：加 !important 修复"搜歌 / 换词 / 下载按钮有焦点但看不到框"。
           原因：上方 body.tv .lrc-btn:focus / body.tv .change-btn:focus { outline:none }
           的优先级 (0,3,1) 高于 button.tv-focus 的 (0,2,1)，遥控器真实 focus 过的按钮
           两个状态同时存在，outline:none 把焦点框吃掉了（OK 键走 JS focusEl 不受影响，
           所以表现为"功能正常但没框"）。!important 一劳永逸压过所有 outline:none。 */
        body.tv .tv-focus,
        body.tv button.tv-focus,
        body.tv .li.tv-focus,
        body.tv .picker-item.tv-focus,
        body.tv #playlistId.tv-focus,
        body.tv #boardSel.tv-focus,
        body.tv #lrcIdInput.tv-focus,
        body.tv #bar.tv-focus {
            outline: 2px solid #FFB300 !important;
            outline-offset: 2px;
        }

        /* ===== 电视端自绘键盘（不依赖系统输入法） =====
           尺寸全部用 vw/vh：1080p、720p 盒子都能按屏宽铺满，不依赖设备像素密度。
           选中态用「整块实心金黄」而不是外框线：遥控器在大屏上找细线很费眼，
           实心块一眼就能看出当前停在哪个键。 */
        #tvKb{
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 2147483001;
            display: none; padding: 1.6vh 0 1.2vh; color: #fff;
            background: linear-gradient(180deg, #1e2a37 0%, #141b24 100%);
            border-top: 1px solid rgba(255,179,0,.5);
            border-radius: 1.4vh 1.4vh 0 0;
            box-shadow: 0 -10px 30px rgba(0,0,0,.55);
        }
        #tvKb.show{ display: block; }
        /* 顶部信息条：[拼音][模式] —— 已输入内容直接写进搜索框，不在这里重复显示 */
        #tvKbBar{ display: flex; align-items: center; gap: 0.9vw; padding: 0 2vw 1vh; }
        #tvKbPy{
            flex: 1; min-width: 0; height: 5.4vh; line-height: 5.4vh; padding: 0 1.4vw;
            border-radius: 0.8vh; background: #22303f; color: #7d93a8; font-size: 2.4vh;
            text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        #tvKbPy.hot{ background: #3a2f16; color: #ffd766; }
        #tvKbMode{
            height: 5.4vh; line-height: 5.4vh; padding: 0 1.2vw; border-radius: 0.8vh;
            background: #22303f; color: #9fc8ff; font-size: 2.2vh; white-space: nowrap;
        }
        /* 候选行（与键盘同宽，左对齐） */
        #tvKbCand{
            display: flex; gap: 0.7vw; height: 6.2vh; align-items: center;
            overflow: hidden; width: 88vw; margin: 0 auto; padding: 0;
        }
        #tvKbCand .cd{
            padding: 0 1.1vw; height: 4.8vh; line-height: 4.8vh; border-radius: 0.8vh;
            background: linear-gradient(180deg, #33424f 0%, #28343f 100%);
            color: #eaf4ff; font-size: 2.4vh; white-space: nowrap;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 2px 3px rgba(0,0,0,.3);
        }
        #tvKbCand .cd.pg{ background: #3c4c5e; color: #ffd766; font-size: 2.2vh; }
        #tvKbCand .cd.md{ background: #3c4c5e; color: #ffca4d; font-size: 2.2vh; }
        #tvKbCand .cd.md.on{ background: linear-gradient(180deg, #ffc94d 0%, #f0a300 100%); color: #1a222b; font-weight: 600; }
        /* 键面：每行固定 88vw 宽、居中，键宽用 flex 权重分配，
           所以四行左右边缘完全对齐，不会一宽一窄 */
        #tvKbRows .kr{
            display: flex; gap: 0.7vw; justify-content: center;
            width: 88vw; margin: 0.7vh auto 0;
        }
        #tvKbRows .kk{
            flex: 1 1 0; min-width: 0;
            height: 6.2vh; border-radius: 0.9vh;
            background: linear-gradient(180deg, #33424f 0%, #25313d 100%);
            color: #fff; font-size: 2.6vh; display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 2px 3px rgba(0,0,0,.35);
        }
        #tvKbRows .kk.fn{ font-size: 2.1vh; color: #c3d5e6; }
        #tvKbRows .kk.swi{
            background: linear-gradient(180deg, #3c4a5c 0%, #2d3846 100%);
            color: #ffd766;
        }
        #tvKbRows .kk.swi.on{
            background: linear-gradient(180deg, #6b5117 0%, #4a370d 100%);
            color: #ffe08a;
        }
        #tvKbRows .kk.act{
            background: linear-gradient(180deg, #2f5c37 0%, #24472b 100%);
            color: #d8f6dd;
        }
        /* 选中：实心金黄 + 柔光，无任何外框线 */
        #tvKb .kk.tv-focus,
        #tvKb .cd.tv-focus{
            outline: 0 none !important; outline-offset: 0 !important;
            background: linear-gradient(180deg, #FFCD63 0%, #FFA900 100%) !important;
            color: #201803 !important;
            box-shadow: 0 0 1vh rgba(255,179,0,.6), inset 0 1px 0 rgba(255,255,255,.4) !important;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="cover"><img src="11.jpg" alt="燕子音乐"></div>
        <div class="title">燕子音乐</div>
    </div>
    <div class="change-wrap">
        <input id="playlistId" type="text" inputmode="text" placeholder="歌名/歌手/歌单ID或链接"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               enterkeyhint="search">
        <button class="change-btn" id="searchBtn">搜歌</button>

        <select id="boardSel">
            <option value="">排行榜...</option>
            <option value="19723756">飙升榜</option>
            <option value="3779629">新歌榜</option>
            <option value="3778678">热歌榜</option>
            <option value="2884035">原创榜</option>
        </select>

    </div>

    <div class="player-card" id="playerCard">
        <div class="p-fixed">
        <div class="p-main">
            <div class="p-pic" id="pic"><img src="" alt="" decoding="async"></div>
            <div class="p-info">
                <div class="p-name" id="songName">点击播放键开始</div>
                <div class="p-artist" id="songArtist">加载中...</div>
            </div>
        </div>
        <div class="p-lrc" id="lrcBox"></div>
        <div class="lrc-ctrl">
            <button class="lrc-btn" data-action="offset-back" title="歌词延后 0.1s" aria-label="歌词延后0.1秒">−</button>
            <span class="lrc-off" id="lrcOff">+0.18s</span>
            <button class="lrc-btn" data-action="offset-fwd" title="歌词提前 0.1s" aria-label="歌词提前0.1秒">+</button>
            <button class="lrc-btn wide" data-action="change-lrc" title="歌词配错了？换一个源">换词</button>
            <button class="lrc-btn wide" data-action="download" title="下载当前播放歌曲（VIP/付费歌只能下载到30秒试听版）">下载</button>
        </div>
        <div class="p-ctrl">
            <div class="p-progress">
                <span id="curTime">00:00</span>
                <div class="p-bar" id="bar" tabindex="0" role="slider"
                     aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
                     title="点按或拖动调整播放进度，遥控器左右键微调进度"><div class="p-bar-played" id="barPlayed"></div></div>
                <span id="totalTime">00:00</span>
            </div>
            <div class="p-btns">
                <button class="p-btn" data-action="prev" title="上一首" aria-label="上一首">
                    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
                </button>
                <button class="p-btn play" id="playBtn" data-action="toggle" title="播放/暂停" aria-label="播放或暂停">
                    <svg class="ico ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="ico ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                </button>
                <button class="p-btn" data-action="next" title="下一首" aria-label="下一首">
                    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
                </button>
                <button class="p-btn vol" id="volBtn" data-action="mute" title="静音/取消静音" aria-label="静音或取消静音">
                    <svg class="ico ico-vol-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <svg class="ico ico-vol-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>

    <!-- 电视端自绘键盘用的精简拼音词库（jieba 词频 + pypinyin 注音离线生成） -->
    <script src="tvkb.js"></script>
    <script>
        var audio = new Audio();
        audio.preload = 'auto';
        /* 启动「响一下就停」的常见诱因之一：new Audio() 创建的是游离元素，部分 Android
           WebView / 电视盒子会在页面布局完成后回收它。挂进 DOM 可稳定持有播放实例。
           零尺寸 + 透明，不用 display:none（有内核会暂停不可见媒体元素）。 */
        audio.setAttribute('playsinline', '');
        audio.setAttribute('webkit-playsinline', '');
        audio.style.cssText = 'position:absolute;left:0;top:0;width:0;height:0;opacity:0;pointer-events:none;';
        (document.body || document.documentElement).appendChild(audio);

        /* ===== v1.22：启动起播「静音预热 + 渐入」 =====
           目标：不管"先响一下再停顿"来自提前起播、缓冲断粮、还是音频焦点抖动，
           只要在**真正稳定出声**之前不让用户听到声音，那一声和中途的停顿就都不存在了。
           判据：'playing' 之后 1.3 秒内没有 pause/waiting/stalled，且没有报错 → 音量快速渐入。
           只对页面加载后的**第一首**做；换歌/切歌立即出声，不能拖。 */
        var volState = { muted: false, ducked: false };
        var warm = { pending: true, active: false, ended: false, startAt: 0, wd: null, st: null, ramp: null };

        /* ===== v1.22：起播事件时间线（屏幕左下角，15 秒后自动收起） =====
           这一版就是要拿真实现场数据，而不是继续凭代码猜：
           记下 play/playing/pause/waiting/stalled 的先后、readyState/networkState/buffered、
           以及我们自己的决策点（arm/go/safePlay/resume）和原生回调（focus/servicePause）。 */
        /* v1.24：面板默认关闭 —— 起播问题已定位并修掉（1.7.28 起播焦点宽限期），
           屏幕上的测试信息全部收掉。以后要再诊断，把它改回 true 即可，
           埋点（媒体事件 / 决策点 / 原生回调）与面板样式都留在代码里。 */
        var ALOG_ON = false;
        var alogLines = [];
        var alogBox = null;
        var alogHideTimer = null;
        var alogT0 = 0;
        function alog(tag){
            if(!ALOG_ON) return;
            if(!alogT0){
                try{ alogT0 = performance.now(); }catch(e){ alogT0 = 0; }
            }
            var t;
            try{ t = ((performance.now() - alogT0) / 1000).toFixed(3); }catch(e){ t = '?'; }
            alogLines.push(t + '  ' + tag);
            if(alogLines.length > 300) alogLines.shift();
            alogPaint();
        }
        function alogPaint(){
            if(!ALOG_ON) return;
            if(!alogBox){
                alogBox = document.createElement('div');
                alogBox.id = 'alogBox';
                /* 左下角、半透明、不吃焦点：只给拍照用 */
                alogBox.style.cssText = 'position:fixed;right:0.6vw;top:22vh;z-index:2147483001;'
                    + 'width:92vw;max-height:34vh;overflow:hidden;pointer-events:none;'
                    + 'background:rgba(0,0,0,.72);color:#7CFF9B;font:1.35vh/1.45 Consolas,monospace;'
                    + 'padding:0.6vh 0.8vw;border-radius:6px;white-space:pre-wrap;word-break:break-all;text-align:left;';
                (document.body || document.documentElement).appendChild(alogBox);
            }
            var keep = alogLines.slice(-16);
            alogBox.textContent = keep.join('\n');
            alogBox.style.display = 'block';
            if(alogHideTimer){ clearTimeout(alogHideTimer); }
            alogHideTimer = setTimeout(function(){ if(alogBox) alogBox.style.display = 'none'; }, 15000);
        }
        window.__alog = alog;
        window.__alogShow = function(){ if(alogBox) alogBox.style.display = 'block'; alogPaint(); };

        /* 媒体元素自己的事件：这是"响一下"的一手证据 */
        (function(){
            var evts = ['loadstart', 'loadedmetadata', 'loadeddata', 'canplay', 'canplaythrough',
                        'play', 'playing', 'pause', 'waiting', 'stalled', 'seeking', 'seeked',
                        'ended', 'error', 'emptied', 'abort', 'suspend'];
            for(var i = 0; i < evts.length; i++){
                (function(name){
                    audio.addEventListener(name, function(){
                        var buf = 0;
                        try{
                            var b = audio.buffered;
                            if(b && b.length){ buf = b.end(b.length - 1) - audio.currentTime; }
                        }catch(e){}
                        alog(name + ' rs=' + audio.readyState + ' ns=' + audio.networkState
                             + ' ct=' + (audio.currentTime || 0).toFixed(2) + ' buf=' + buf.toFixed(2)
                             + ' vol=' + audio.volume);
                        if(name === 'playing'){ warmStable(); }
                        if(name === 'waiting' || name === 'stalled'){ warmResetStable(name); }
                        if(name === 'error'){ warmFinish('error'); }
                        if(name === 'pause'){ warmResetStable('pause'); }
                    }, false);
                })(evts[i]);
            }
        })();

        /* 统一音量出口：用户静音、原生 duck、启动预热三处都走这里，避免互相覆盖。
           预热期间强制 0，预热结束后按目标值渐入。 */
        function volTarget(){ return volState.muted ? 0 : (volState.ducked ? 0.25 : 1); }
        function applyVol(){
            try{ audio.muted = !!volState.muted; }catch(e){}
            if(warm.active && !warm.ended) return;      // 预热中：保持静音
            try{ audio.volume = volTarget(); }catch(e){}
        }
        function warmBegin(){
            if(!warm.pending) return;
            warm.pending = false;
            warm.active = true;
            warm.ended = false;
            warm.startAt = Date.now();
            try{ audio.volume = 0; }catch(e){}
            alog('warm:begin');
            if(warm.wd){ clearTimeout(warm.wd); }
            warm.wd = setTimeout(function(){ warmFinish('timeout8s'); }, 8000);
        }
        function warmStable(){
            if(!warm.active || warm.ended) return;
            if(warm.st){ clearTimeout(warm.st); }
            warm.st = setTimeout(function(){
                warm.st = null;
                if(!warm.active || warm.ended) return;
                if(audio.paused || audio.readyState < 3){ warmStable(); return; }   // 还在抖，再等一轮
                warmFinish('stable');
            }, 1000);
        }
        function warmResetStable(why){
            if(!warm.active || warm.ended) return;
            if(warm.st){ clearTimeout(warm.st); warm.st = null; }
            alog('warm:hold(' + why + ')');
        }
        function warmFinish(reason){
            if(!warm.active || warm.ended) return;
            warm.active = false;
            warm.ended = true;
            if(warm.wd){ clearTimeout(warm.wd); warm.wd = null; }
            if(warm.st){ clearTimeout(warm.st); warm.st = null; }
            alog('warm:end(' + reason + ')');
            var target = volTarget();
            var step = 0;
            if(warm.ramp){ clearInterval(warm.ramp); }
            if(target <= 0){ try{ audio.volume = 0; }catch(e){} return; }
            warm.ramp = setInterval(function(){
                step++;
                try{ audio.volume = Math.min(target, target * step / 5); }catch(e){}
                if(step >= 5){
                    clearInterval(warm.ramp); warm.ramp = null;
                    try{ audio.volume = target; }catch(e){}
                }
            }, 60);
        }
        /** 原生 duck 回调：以前 Java 直接写 audio.volume，会把预热的静音冲掉，改走这里 */
        window.__setDuck = function(on){
            volState.ducked = !!on;
            alog('native:duck ' + (on ? 1 : 0));
            applyVol();
        };

        var songList = [];
        var curIndex = 0;
        var muted = false;
        var lrcLines = [];
        var lrcEls = [];
        var lastLrcIdx = -1;
        var listHidden = false;      // 播放列表折叠状态：默认展开，由「列表」按钮切换
        var LRC_BASE_OFFSET = 0.18;
        var LRC_OFFSET_STEP = 0.1;
        var songOffsets = {};
        var playMode = 0;
        var modeLabels = ['列表循环', '单曲循环', '随机播放'];
        var oneShotStatus = false;
        // 启动默认播放的推荐好歌（时长>60秒、可播放完整版、带官方封面）
        var DEFAULT_START = { id: '1357374736', name: '海阔天空', artist: 'Beyond',
                              pic: 'https://p1.music.126.net/qnQ93WnZHACVvIM14c4sAQ==/109951163984007061.jpg' };

        /* ===== 音源注册表 =====
           qj  qijieya（主源，Meting 风格）：url 直接 302 到音频流，lrc 直接返回 LRC 文本
           ij  injahow 镜像（Meting 风格，同样 302 直链 / LRC 文本；不支持 search，只支持 playlist）
           gd  gdstudio 直链（参数名是 types 复数）：url / lyric / pic 全部返回 JSON，需要二次解析
           播放地址按 qj → ij → gd 顺序自动回退；歌词、封面同样有回退链。 */
        var SRC = {
            qj: {
                label: 'qijieya',
                url:      function(id){ return 'https://api.qijieya.cn/meting/?server=netease&type=url&id=' + id; },
                lrc:      function(id){ return 'https://api.qijieya.cn/meting/?server=netease&type=lrc&id=' + id; },
                pic:      function(id){ return 'https://api.qijieya.cn/meting/?server=netease&type=pic&id=' + id; },
                playlist: function(id){ return 'https://api.qijieya.cn/meting/?server=netease&type=playlist&id=' + id; },
                search:   function(kw){ return 'https://api.qijieya.cn/meting/?server=netease&type=search&id=' + encodeURIComponent(kw) + '&limit=100'; }
            },
            ij: {
                label: 'injahow 镜像',
                url:      function(id){ return 'https://api.injahow.cn/meting/?type=url&id=' + id; },
                lrc:      function(id){ return 'https://api.injahow.cn/meting/?type=lrc&id=' + id; },
                pic:      function(id){ return 'https://api.injahow.cn/meting/?type=pic&id=' + id; },
                playlist: function(id){ return 'https://api.injahow.cn/meting/?type=playlist&id=' + id; },
                search:   null   // 该镜像 search 返回 {"error":"unknown type"}，不参与搜索
            },
            gd: {
                label: 'gdstudio 直链',
                url:      function(id){ return 'https://music-api.gdstudio.xyz/api.php?types=url&source=netease&id=' + id + '&br=320'; },
                lrc:      function(id){ return 'https://music-api.gdstudio.xyz/api.php?types=lyric&source=netease&id=' + id; },
                pic:      function(id){ return 'https://music-api.gdstudio.xyz/api.php?types=pic&source=netease&id=' + id; },
                playlist: null,
                search:   function(kw){ return 'https://music-api.gdstudio.xyz/api.php?types=search&source=netease&name=' + encodeURIComponent(kw) + '&count=99&pages=1'; }
            }
        };
        /** 当前实际生效的播放音源名，仅用于状态提示 */
        var curSrcLabel = SRC.qj.label;

        /* ===== 图标状态（SVG + class 切换，不再改 textContent） ===== */
        function setPlayIcon(playing){ $('playBtn').classList.toggle('is-playing', !!playing); }
        function setMuteIcon(m){ $('volBtn').classList.toggle('is-muted', !!m); }
        function setModeIcon(m){ $('modeBtn').setAttribute('data-mode', String(m)); }
        /** 切 .p-pic 的播放态。必须保留 no-cover —— 直接赋 className 会把"无封面"占位一起冲掉，
            图片已 display:none 时就会露出底下的灰洞。 */
        function setPicState(st){
            var box = $('pic');
            var nc = box.classList.contains('no-cover');
            box.className = 'p-pic' + (st ? ' ' + st : '') + (nc ? ' no-cover' : '');
        }

        /* ===== 音源健康度：记住哪个源最近可用，下次优先试它 =====
           三个镜像都没有 SLA，主源经常挂。旧逻辑每次都从 qj 开始，
           主源挂掉时用户每次都白等一次超时才切到镜像。这里按"最近是否成功 + 连续失败次数"排序，
           让上一次好用的源排到最前；连续失败会把它压到后面，自动恢复时又会重新排上来。
           数据存 localStorage，跨启动有效；只存 3 个 key，不会无限增长。 */
        var srcStat = {};
        function loadSrcStat(){
            try{ srcStat = JSON.parse(localStorage.getItem('srcStat') || '{}') || {}; }catch(e){ srcStat = {}; }
        }
        function saveSrcStat(){
            try{ localStorage.setItem('srcStat', JSON.stringify(srcStat)); }catch(e){}
        }
        function noteSrc(key, ok){
            if(!key) return;
            var s = srcStat[key] || (srcStat[key] = { ok: 0, fail: 0, ts: 0 });
            if(ok){ s.ok++; s.fail = 0; s.ts = Date.now(); }
            else { s.fail = Math.min(9, (s.fail || 0) + 1); }
            saveSrcStat();
        }
        function srcScore(key){
            var s = srcStat[key];
            if(!s) return 0;
            return (s.ts ? 1000 : 0) - (s.fail || 0) * 100 + Math.min(99, s.ok || 0);
        }
        /** 按健康度排序后的音源键；默认顺序 qj → ij → gd（播放源优先 qijieya） */
        function rankedSrcKeys(){
            // 用户指定：qijieya 固定为第一播放源，其余（injahow 镜像 → gdstudio 直链）按健康度动态排序。
            // 唯一的例外保护：qijieya 连续失败 3 次且从未成功过时，临时让位给备源，
            // 避免每次切歌都先白撞一遍挂掉的主源；qijieya 一旦恢复成功（fail 归零）自动回到首位。
            var rest = ['ij', 'gd'].sort(function(a, b){ return srcScore(b) - srcScore(a); });
            var s = srcStat.qj;
            if(s && (s.fail || 0) >= 3 && !s.ts) return rest.concat(['qj']);
            return ['qj'].concat(rest);
        }

        /* ===== 本地存储裁剪：只增不减的老实现早晚撞配额（撞了就被 catch 吞掉，记忆静默失效） ===== */
        var STORE_MAX_KEYS = 300;
        function trimStore(obj, max){
            var keys = Object.keys(obj);
            if(keys.length <= max) return obj;
            // 字符串键按插入顺序枚举，删掉最早的一批
            for(var i = 0; i < keys.length - max; i++) delete obj[keys[i]];
            return obj;
        }
        /** 生成一首歌的播放地址候选。qijieya 固定优先，其余源按健康度动态排，
            qijieya 连续失败时临时让位、恢复后自动回首位。 */
        var SRC_META = {
            qj: { json: false, f: function(id){ return SRC.qj.url(id); } },
            ij: { json: false, f: function(id){ return SRC.ij.url(id); } },
            gd: { json: true,  f: function(id){ return SRC.gd.url(id); } }
        };
        function buildPlayUrls(s){
            var id = s.urlId || s._origId || s.id;
            if(!id) return [];
            var keys = rankedSrcKeys(), out = [];
            for(var i = 0; i < keys.length; i++){
                var k = keys[i];
                out.push({ key: k, label: SRC[k].label, u: SRC_META[k].f(id), json: SRC_META[k].json });
            }
            return out;
        }

        function $(id){ return document.getElementById(id); }
        /* ===== v1.15 底部提示弹窗 =====
           所有提示（含错误）统一走 #status 这一个 fixed 浮层，由 .show 控制弹出/收起。
           以前 #status 是文档流里的一行、错误另有 #errorCard 一行，两者都会在卡片下方
           占高度并露出蓝色背景带；合并后浮层不占布局，卡片可铺到屏幕底边。
           每条消息独立计时，2 秒后自动收起；新消息重置计时。 */
        var STATUS_DWELL = 2000;
        var statusTimer = null;
        function showStatus(m, oneShot, isErr){
            var el = $('status');
            el.textContent = m || '';
            // 不用 classList.toggle 的第二参数：部分老电视盒子 WebView 不支持
            if(isErr && m) el.classList.add('err'); else el.classList.remove('err');
            if(m) el.classList.add('show'); else el.classList.remove('show');
            oneShotStatus = !!oneShot;
            if(statusTimer){ clearTimeout(statusTimer); statusTimer = null; }
            if(m){
                statusTimer = setTimeout(function(){
                    statusTimer = null;
                    el.textContent = '';
                    el.classList.remove('show');
                    el.classList.remove('err');
                    oneShotStatus = false;
                }, STATUS_DWELL);
            }
        }
        /* 错误提示：复用同一个弹窗，只换红底。电视上浮层 fixed 于视口，
           不会再像旧 #errorCard 那样被挤出屏幕，三端表现一致。 */
        function showError(m){ showStatus(m, true, true); }
        /* 只收起"错误"弹窗，避免误清掉紧随其后要显示的"正在加载…"等普通提示 */
        function hideError(){
            var el = $('status');
            if(el && el.classList.contains('err')) showStatus('');
        }
        // 弹窗开关上报原生层：弹窗打开时按返回只关弹窗，不再直接退出 App
        function notifyPicker(open){
            try{ if(window.Yanzi && typeof window.Yanzi.setPickerOpen === 'function') window.Yanzi.setPickerOpen(!!open); }catch(e){}
        }

        /* ===== 返回键：连按两次才退出 =====
           三条入口共用同一状态机，避免各自计数：
             1) APP 原生层 onBackPressed → window.__onBack()，返回 true=拦截 / false=放行 finish()
             2) 纯网页端（PC / 手机浏览器）→ history 哨兵 + popstate
             3) 电视遥控器 Escape → initTvRemote 的 keydown 分支

        var BACK_GAP = 2000;
        var lastBackAt = 0;
        var lastBackHandledAt = 0;
        var backResetTimer = null;
        function handleBack(){
            var now = Date.now();
            if(now - lastBackHandledAt < 80){ lastBackHandledAt = now; return true; }
            lastBackHandledAt = now;
            if(!document.body) return true;                  // DOM 未就绪：一律拦截
            // 1) 弹窗打开时，返回只关弹窗

            if(mask && mask.classList.contains('show')){ closePicker(); return true; }

            //    收起即 blur，两者同生同灭，不会出现「要按三次才能退出」。
            var aeBack = document.activeElement;

            }

            if(now - lastBackAt < BACK_GAP){

                if(backResetTimer){ clearTimeout(backResetTimer); backResetTimer = null; }
                return false;                                 // 放行：原生 finish() / 浏览器后退
            }

            showStatus(msg, true);

             遥控器方向键选键、确认键输入 → 输入直接写进页面自己的输入框，

           词库 tvkb.js：音节→常用字 + 全拼→常用词（jieba 词频 + pypinyin 注音离线生成）。 */
        var TVKB_C = null, TVKB_W = null, TVKB_WMAP = null,

        function tvkbDict(){

            TVKB_WALT = {};                  // 全拼键 -> 同音词列表（塑性/苏醒 都挂 suxing）
            try{

                var ws = (typeof TVKB_WORDS === 'string') ? TVKB_WORDS : '';
                var sy = (typeof TVKB_SYL === 'string') ? TVKB_SYL : '';

                var used = {}, cnt = 0, key2, list1, list2, ch;

        function tvkbSeg(py){

            var n = py.length, dp = new Array(n + 1), i, len, s;

           打分 = 字频名次之和 + 邻接成词奖励（"过境""天空"这种 2 字词给 -5，3 字词给 -8）。
           这是没有语言模型时的近似做法：词库里没有的四字词（如"时过境迁"），
           靠邻接奖励把正确的字顶到候选前面。束搜索保证长串（8 音节以内）也不会算爆。 */
        function tvkbSmart(segs){
            tvkbDict();
            var n = segs.length, k = 8, beam = [{ w: '', s: 0 }], i, j, c, list, next, w, s, len;
            if(n < 2 || n > 8) return [];
            for(i = 0; i < n; i++){
                var cs = TVKB_C[segs[i]];
                if(!cs) return [];
                list = [];
                for(j = 0; j < cs.length && j < k; j++) list.push([cs.charAt(j), j]);
                next = [];
                for(j = 0; j < beam.length; j++){
                    for(c = 0; c < list.length; c++){
                        w = beam[j].w + list[c][0];
                        s = beam[j].s + list[c][1];
                        len = w.length;
                        if(len >= 2 && TVKB_W2[w.substr(len - 2, 2)]) s -= 5;
                        if(len >= 3 && TVKB_W3[w.substr(len - 3, 3)]) s -= 8;
                        next.push({ w: w, s: s });
                    }
                }
                next.sort(function(a, b){
                    return (a.s - b.s) || (a.w < b.w ? -1 : 1);
                });
                beam = next.slice(0, 40);
            }
            var out = [], seen = {};
            for(i = 0; i < beam.length && out.length < 12; i++){
                if(!seen[beam[i].w]){ seen[beam[i].w] = 1; out.push(beam[i].w); }
            }
            return out;
        }

        /* 用户词库：用户一次敲完整串拼音、把某个词整串上屏时，记下"拼音→词"。
           下次只要这个拼音进来，它就排第一。存在 localStorage（原生已开 setDomStorageEnabled），
           只留最近 300 条，避免无限增长。 */
        function tvkbUser(){
            try{
                var s = localStorage.getItem('tvkbUser');
                return s ? JSON.parse(s) : {};
            }catch(e){ return {}; }
        }

        function tvkbLearn(py, w){
            if(!py || !w || w.length < 2) return;
            try{
                var u = tvkbUser();
                if(u[py] === w) return;
                u[py] = w;
                var keys = [], k;
                for(k in u){ if(u.hasOwnProperty(k)) keys.push(k); }
                if(keys.length > 300) delete u[keys[0]];
                localStorage.setItem('tvkbUser', JSON.stringify(u));
            }catch(e){}
        }

        /* 上屏一个词，并按"这个词覆盖了几个音节"把剩下的拼音留在输入串里。
           这是搜狗式的逐字组词：输入 shiguojingqian，先选"时"（1 个音节）→ 余下 guojingqian，
           再选"过""境""迁"；词库里没有的歌名也能这样一个个字打出来。 */
        function tvkbCommitWord(w){
            if(!tvkb) return;
            var pyBefore = tvkb.py, segs = tvkbSeg(pyBefore), n = segs ? segs.length : 0, m = n, i, key;
            for(i = 1; i <= n; i++){
                key = segs.slice(0, i).join('');
                if(TVKB_WMAP[key] === w){ m = i; break; }
            }
            if(n > 1 && w.length === 1 && TVKB_C[segs[0]] && TVKB_C[segs[0]].indexOf(w) >= 0) m = 1;
            if(n === 0) m = 0;
            /* 记一次"拼音会话"的起点：用户把整串拼音敲完、一个个字选上去，
               最后整串拼音吃完时，把这段文本连同起始拼音一起记进用户词库。 */
            if(n >= 2 && !tvkb.sessPy){ tvkb.sessPy = pyBefore; tvkb.sessFrom = tvkb.text.length; }
            tvkb.text += w;
            tvkb.py = (n && m < n) ? segs.slice(m).join('') : '';
            tvkb.cpage = 0;
            // 逐字模式下只吃掉了一部分音节时保持逐字，接着选下一个字
            tvkb.pickMode = (tvkb.py && tvkb.pickMode) ? 1 : 0;
            if(!tvkb.py && tvkb.sessPy){
                var added = tvkb.text.slice(tvkb.sessFrom);
                if(added.length >= 2) tvkbLearn(tvkb.sessPy, added);
                tvkb.sessPy = '';
            }
        }

        /* 候选，优先级照搜狗的顺序：
             ① 用户词库（自己打过的词）
             ② 整词精确（全拼完整命中）
             ③ 单字（输入串正好是一个音节）
             ④ 简拼（每个音节首字母，如 sgjq → 时过境迁、zjl → 周杰伦）
             ⑤ 智能组词（音节拼不起来整词时，用高频字组合补出来）
             ⑥ 前缀词（词的全拼以输入串开头）
           pickMode=1 时是"逐字"：把首音节的全部候选字摊开，一个字一个字地选。
           英文/数字直输模式没有候选。 */
        function tvkbCands(){
            tvkbDict();
            var py = tvkb.py, out = [], seen = {}, i, cnt, cs, e, segs, smart;
            if(!py || tvkb.mode !== 'zh') return out;
            var add = function(x){ if(x && !seen[x]){ seen[x] = 1; out.push(x); } };
            if(tvkb.pickMode){
                segs = tvkbSeg(py);
                cs = segs ? TVKB_C[segs[0]] : null;
                if(cs){ for(i = 0; i < cs.length; i++) add(cs.charAt(i)); }
                return out;
            }
            var uw = tvkbUser();
            if(uw[py]) add(uw[py]);
            /* 整词精确命中：同一个全拼键上的同音词全给（suxing → 塑性、苏醒） */
            var altw = TVKB_WALT[py];
            if(altw){ for(i = 0; i < altw.length; i++) add(altw[i]); }
            cs = TVKB_C[py];
            if(cs){ for(i = 0; i < cs.length; i++) add(cs.charAt(i)); }
            if(py.length >= 2){
                cnt = 0;
                var ba = TVKB_BA[py.charAt(0)] || [], bi, pass;
                for(pass = 0; pass < 2 && cnt < 70; pass++){
                    for(bi = 0; bi < ba.length && cnt < 70; bi++){
                        e = TVKB_W[ba[bi]];
                        if(e[1].length < py.length || e[1].indexOf(py) !== 0) continue;
                        /* 第一轮只要"简拼音节数正好等于输入字母数"的词（sx → 相声、小时 这类两个字、
                           各取一个首字母的），第二轮才补更长的简拼（sxjq 之类），
                           免得打两个字母时被一堆长词的简拼挤满首页。 */
                        if((e[1].length === py.length) !== (pass === 0)) continue;
                        add(e[2]); cnt++;
                    }
                }
            }
            /* ⑦ 混拼：每个音节打"任意长度前缀"（zhhm / nhao / liuh 这类）。
               放在智能组词之前：混拼命中的是词库里的真词（你好、张惠妹），
               而智能组词在"尾音节只有半个字母"时容易凑出"嗯好"这种废词。 */
            if(py.length >= 3 && out.length < 120){
                var mix = tvkbMix(py);
                for(i = 0; i < mix.length; i++) add(mix[i]);
            }
            segs = tvkbSeg(py);
            if(segs && segs.length >= 2){
                smart = tvkbSmart(segs);
                for(i = 0; i < smart.length; i++) add(smart[i]);
            }
            if(py.length >= 2){
                var bk = TVKB_BK[py.charAt(0)] || [], bj;
                for(bj = 0; bj < bk.length && out.length < 120; bj++){
                    e = TVKB_W[bk[bj]];
                    if(e[0].length >= py.length && e[0].indexOf(py) === 0) add(e[2]);
                }
            }
            return out;
        }

        /* ===== 1.7.31：混拼（搜狗式"音节任意前缀"输入） =====
           例：zhhm ↔ zhang|hui|mei 的张惠妹、nhao ↔ ni|hao 的你好、liuh ↔ liu|h 的刘欢。
           判定方式：把候选词的全拼按音节表切成音节，输入串里每一段必须恰好是某个音节的
           "任意长度前缀"，并且输入用完时拼音也正好用完。整段用一张定长布尔表做 DP，
           每候选最多 400 格、不分配对象，盒子上也吃不掉帧。
           （注：匹配逻辑内联在本函数里，不做二次函数调用 —— 这类小程序在部分环境的
             惰性编译下跨函数引用会丢绑定，内联最稳。） */
        var MIX_DP = null;
        var tvkbMix = function(q){
            var out = [], bk = TVKB_BK[q.charAt(0)] || [], i, j, L, m, pr, ql, pl, s, p, py, inw;
            ql = q.length;
            if(ql < 2) return out;
            if(!MIX_DP){ MIX_DP = []; for(i = 0; i < 400; i++) MIX_DP[i] = 0; }
            for(i = 0; i < bk.length && out.length < 30; i++){
                inw = TVKB_W[bk[i]];
                py = inw[0];
                pl = py.length;
                if(pl < ql || pl >= 20) continue;
                /* 必要条件的两种剪枝：一个音节至少吃 1 个输入字母，所以音节数（=简拼长度）
                   不会超过输入长度；首字母也必须相同。两个条件能挡掉桶里绝大多数词。 */
                if(inw[1].length > ql) continue;
                if(q.charCodeAt(0) !== py.charCodeAt(0)) continue;
                /* 快速预筛：混拼的字母必然是 py 的子序列（按顺序出现），不满足直接否掉 */
                for(j = 0, m = 0; j < pl && m < ql; j++){
                    if(py.charCodeAt(j) === q.charCodeAt(m)) m++;
                }
                if(m < ql) continue;
                for(j = 0; j < (ql + 1) * 20; j++) MIX_DP[j] = 0;
                MIX_DP[0] = 1;                     // i=0, j=0：什么都没吃、停在拼音开头
                for(m = 0; m < ql; m++){
                    for(j = 0; j < pl; j++){
                        if(!MIX_DP[m * 20 + j]) continue;
                        for(L = 1; L <= TVKB_MAXSYL && j + L <= pl; L++){
                            s = py.substr(j, L);
                            if(!TVKB_S[s]) continue;         // 不是合法音节，试更长的
                            for(pr = 1; pr <= L && m + pr <= ql; pr++){
                                p = q.substr(m, pr);
                                if(s.indexOf(p) !== 0) break;  // 前缀不匹配，更长的也不匹配
                                MIX_DP[(m + pr) * 20 + j + L] = 1;
                            }
                        }
                    }
                }
                if(MIX_DP[ql * 20 + pl]) out.push(inw[2]);
            }
            return out;
        };

        /* 顶部信息条只剩两个胶囊：左边当前拼音（按音节用 ' 分隔，跟搜狗一致），右边当前模式。
           已输入内容不再显示在这里 —— 它已经实时写进搜索框了。 */
        function tvkbBufShow(){
            var p = $('tvKbPy'), m = $('tvKbMode');
            if(!p || !m || !tvkb) return;
            if(tvkb.py){
                var seg = tvkbSeg(tvkb.py);
                p.textContent = '拼音：' + ((seg && seg.length > 1) ? seg.join("'") : tvkb.py);
                p.className = 'hot';
            } else if(tvkb.pickMode){
                p.textContent = '拼音：' + tvkb.py;
                p.className = 'hot';
            } else {
                p.textContent = tvkb.mode === 'zh' ? '拼音输入，内容直接进搜索框' : (tvkb.mode === 'en' ? '英文直输，内容直接进搜索框' : '数字直输');
                p.className = '';
            }
            m.textContent = (tvkb.mode === 'zh' ? '中文' : (tvkb.mode === 'en' ? '英文' : '数字'))
                + (tvkb.pickMode ? '·逐字' : '');
        }

        function tvkbPaint(){
            var all = document.querySelectorAll('#tvKb .kk, #tvKb .cd');
            for(var i = 0; i < all.length; i++) all[i].classList.remove('tv-focus');
            var el = tvkb.rows && tvkb.rows[tvkb.r] && tvkb.rows[tvkb.r][tvkb.c];
            if(el) el.classList.add('tv-focus');
        }

        /* 重画候选行 + 重排导航行；keepKey 指定重画后把焦点停回哪个键（同 data-k） */
        function tvkbRender(keepKey){
            if(!tvkb) return;
            var cand = $('tvKbCand');
            var host = $('tvKbRows');
            if(!cand || !host) return;
            tvkbSync();
            tvkb.cands = tvkbCands();
            tvkb.segs = tvkbSeg(tvkb.py);
            cand.innerHTML = '';
            var per = 9, from = tvkb.cpage * per;
            var to = Math.min(tvkb.cands.length, from + per);
            var chips = [], i, b;
            /* 多音节输入时给一个"逐字"开关：词库里没有的长串（歌名之类）可以摊开首音节全部候选字，
               一个字一个字往下选，剩下的拼音会保留。 */
            var segR = tvkb.segs || null;
            if(segR && segR.length >= 2){
                b = document.createElement('div');
                b.className = 'cd md' + (tvkb.pickMode ? ' on' : '');
                b.textContent = tvkb.pickMode ? '词组' : '逐字';
                b.setAttribute('data-k', tvkb.pickMode ? '词组' : '逐字');
                b.addEventListener('click', function(){ tvkbPress(tvkb.pickMode ? '词组' : '逐字'); });
                cand.appendChild(b); chips.push(b);
            }
            if(tvkb.cpage > 0){
                b = document.createElement('div');
                b.className = 'cd pg';
                b.textContent = '◂';
                b.setAttribute('data-k', '◂');
                b.addEventListener('click', function(){ tvkbPress('◂'); });
                cand.appendChild(b); chips.push(b);
            }
            for(i = from; i < to; i++){
                (function(idx, word){
                    var c = document.createElement('div');
                    c.className = 'cd';
                    c.textContent = word;
                    c.setAttribute('data-k', '#' + idx);
                    c.addEventListener('click', function(){ tvkbPick(idx); });
                    cand.appendChild(c);
                    chips.push(c);
                })(i, tvkb.cands[i]);
            }
            if(to < tvkb.cands.length){
                b = document.createElement('div');
                b.className = 'cd pg';
                b.textContent = '▸';
                b.setAttribute('data-k', '▸');
                b.addEventListener('click', function(){ tvkbPress('▸'); });
                cand.appendChild(b); chips.push(b);
            }
            var rows = [];
            if(chips.length) rows.push(chips);
            var krow = host.querySelectorAll('.kr');
            for(i = 0; i < krow.length; i++) rows.push([].slice.call(krow[i].children));
            tvkb.rows = rows;
            var found = false;
            if(keepKey){
                for(var a = 0; a < rows.length && !found; a++){
                    for(var c2 = 0; c2 < rows[a].length; c2++){
                        if(rows[a][c2].getAttribute('data-k') === keepKey){
                            tvkb.r = a; tvkb.c = c2; found = true; break;
                        }
                    }
                }
            }
            if(!found){
                if(tvkb.r > rows.length - 1) tvkb.r = rows.length - 1;
                if(tvkb.r < 0) tvkb.r = 0;
                if(tvkb.c > rows[tvkb.r].length - 1) tvkb.c = rows[tvkb.r].length - 1;
                if(tvkb.c < 0) tvkb.c = 0;
            }
            tvkbBufShow();
            tvkbPaint();
        }

        /* 焦点移动。上下到边就停住（换行会让"上/下"失去方向感）；
           左右做**行内循环**：最左再按左跳到最右，最右再按右跳回最左。 */
        function tvkbMove(dx, dy){
            if(!tvkb || !tvkb.rows || !tvkb.rows.length) return;
            if(dy){
                var r = tvkb.r + dy;
                if(r < 0) r = 0;
                if(r > tvkb.rows.length - 1) r = tvkb.rows.length - 1;
                tvkb.r = r;
                if(tvkb.c > tvkb.rows[r].length - 1) tvkb.c = tvkb.rows[r].length - 1;
            }
            if(dx){
                var len = tvkb.rows[tvkb.r].length, c = tvkb.c + dx;
                if(c < 0) c = len - 1;
                if(c > len - 1) c = 0;
                tvkb.c = c;
            }
            tvkbPaint();
        }

        /* 有拼音时把首选候选上屏；一个候选都没有（打了一串不是拼音的字母）才按原字母上屏 */
        function tvkbCommit(){
            if(!tvkb || !tvkb.py) return;
            var w = tvkb.cands && tvkb.cands[0];
            if(w) tvkbCommitWord(w);
            else { tvkb.text += tvkb.py; tvkb.py = ''; tvkb.cpage = 0; tvkb.pickMode = 0; }
        }

        function tvkbPick(i){
            var w = tvkb && tvkb.cands && tvkb.cands[i];
            if(!w) return;
            tvkbCommitWord(w);
            tvkb.r = 0; tvkb.c = 0;
            tvkbRender(null);
        }

        function tvkbOk(){
            var el = tvkb && tvkb.rows && tvkb.rows[tvkb.r] && tvkb.rows[tvkb.r][tvkb.c];
            if(!el) return;
            tvkbPress(el.getAttribute('data-k'));
        }

        function tvkbPress(k){
            if(!tvkb || !k) return;
            var keep = k;
            if(k === '⌫'){
                if(tvkb.py){ tvkb.py = tvkb.py.slice(0, -1); }
                else { tvkb.text = tvkb.text.slice(0, -1); }
                tvkb.cpage = 0;
                /* 退格后必须把焦点"按 key 名"找回来：候选行会随候选数量增减而出现/消失，
                   行下标会整体平移，若只按旧 r/c 复位，焦点就会跳到别的键（以前跳到"搜索"）。 */
                keep = '⌫';
            } else if(k === '▸'){
                tvkb.cpage++;
            } else if(k === '◂'){
                tvkb.cpage--; if(tvkb.cpage < 0) tvkb.cpage = 0;
            } else if(k === '空格'){
                tvkbCommit();
                tvkb.text += ' ';
            } else if(k === '逐字'){
                tvkb.pickMode = 1; tvkb.cpage = 0; keep = '逐字';
            } else if(k === '词组'){
                tvkb.pickMode = 0; tvkb.cpage = 0; keep = '词组';
            } else if(k === '中/英'){
                // 中文（拼音 + 候选）↔ 英文（字母直接上屏）；数字键盘按它回到字母。
                // 切换后焦点仍留在这个键上，不让用户突然找不到焦点。
                tvkb.mode = (tvkb.mode === 'zh') ? 'en' : 'zh';
                tvkb.py = ''; tvkb.cpage = 0;
                tvkbBuildRows(); tvkb.r = 0; tvkb.c = 0; keep = '中/英';
            } else if(k === '⇧'){
                // 大小写切换：只影响英文直输和键面显示，中文拼音仍是小写
                tvkb.caps = tvkb.caps ? 0 : 1;
                tvkbBuildRows(); keep = '⇧';
            } else if(k === '123'){
                tvkb.mode = 'num'; tvkb.py = ''; tvkb.cpage = 0;
                tvkbBuildRows(); tvkb.r = 0; tvkb.c = 0; keep = '1';
            } else if(k === '搜索'){
                tvkbCommit();
                tvkbClose();
                try{ loadOrSearch(); }catch(e){}
                return;
            } else if(k.charAt(0) === '#'){
                tvkbPick(parseInt(k.slice(1), 10)); return;
            } else if(k >= 'a' && k <= 'z' && k.length === 1 && tvkb.mode === 'zh'){
                tvkb.py += k; tvkb.cpage = 0;
            } else {
                // 英文 / 数字 / 标点：直接上屏（英文按大小写键的当前状态决定大小写）
                tvkb.text += (tvkb.mode === 'en' && tvkb.caps && k >= 'a' && k <= 'z' && k.length === 1)
                    ? k.toUpperCase() : k;
            }
            tvkbRender(keep);
        }

        function openTvKb(el, mode){
            if(!isTv || !el) return;
            tvkbDict(); tvkbBuild();
            /* 按到搜索框就先把上一次的关键词清掉，省得接着旧词往下打；
               歌词"输入歌曲ID"框是编辑已有 ID，保留原值。 */
            var start = '';
            if(el.id === 'lrcIdInput') start = String(el.value || '');
            try{ el.value = start; }catch(e0){}
            tvkb = {
                el: el, text: start, py: '', cands: [], segs: null,
                cpage: 0, mode: (mode === 'num' ? 'num' : 'zh'), rows: null, r: 0, c: 0,
                pickMode: 0, sessPy: '', sessFrom: 0, caps: 0
            };
            remoteClear();
            el.classList.add('tv-focus');
            focusEl = el;
            focusKey = focusKeyOf(el);
            var box = $('tvKb');
            if(box){
                box.classList.add('show');
                tvkbBuildRows();
                tvkbRender(null);
                tvkbSync();
            }
            try{ if(window.Yanzi && Yanzi.setKbOpen) Yanzi.setKbOpen(true); }catch(e){}
            if(window.__diag) window.__diag('tvkb open ' + (el.id || el.tagName) + ' ' + tvkb.mode);
        }
        window.__openTvKb = openTvKb;

        function tvkbClose(){
            if(!tvkb) return;
            // 关键盘时把还没上屏的拼音一并落进输入框：直接按"完成"不该把刚打的字母丢掉
            tvkbCommit();
            var el = tvkb.el, text = tvkb.text;
            var box = $('tvKb');
            if(box) box.classList.remove('show');
            tvkb = null;
            if(el){
                try{ el.value = text; }catch(e){}
                try{ el.dispatchEvent(new Event('input', { bubbles: true })); }catch(e2){}
                /* 这里绝不做真实 el.focus()：真实聚焦会让 Chromium 又去依附系统输入法，
                   电视端的输入完全由这块自绘键盘完成，输入框只需要视觉焦点环。 */

        /* 取文本。必须保证 cb 只被调用一次：

               done 已置真被丢弃；
             · searchMulti 的 busy 被多减一次 → 提前 finish([])，慢一些但能用的源结果被丢弃；

        /* ===== APP 原生代请求桥接（可选，未接入时行为完全不变） =====

            function once(txt){

        function parseLrc(text){
            var lines = [];
            if(!text) return lines;
            text = text.replace(/^\uFEFF/, '').replace(/\r/g, '');
            // 剥离卡拉OK逐字标签（增强型 LRC）：行内 <00:10.00>词<00:12.00>词，不剥会原样显示到屏幕
            text = text.replace(/<\d{1,3}:\d{1,2}(?:[.:]\d{1,3})?>/g, '');
            // 解析歌词自带的整体偏移标签 [offset:±毫秒]，应用到所有行
            var om = text.match(/\[offset:([+-]?\d+)\s*\]/);
            var offsetSec = om ? (parseInt(om[1], 10) / 1000) : 0;
            // 按行解析：行首可堆叠多个时间标签（重复句写法 [00:10][00:20]副歌），
            // 每个时间标签各生成一行、共享同一文本；旧正则逐个匹配会丢掉"空文本时间标签"，
            // 导致重复句的第一个时间点整行消失
            var lineRe = /[^\n]+/g;
            var tagRe = /\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
            var lm;
            while((lm = lineRe.exec(text))){
                var seg = lm[0];
                tagRe.lastIndex = 0;
                var times = [], consumed = 0, m2;
                while((m2 = tagRe.exec(seg))){
                    var min = parseInt(m2[1], 10) || 0;
                    var sec = parseInt(m2[2], 10) || 0;
                    var msStr = m2[3] || '';
                    var ms = 0;
                    if(msStr){
                        if(msStr.length === 1) ms = parseInt(msStr,10) * 100;
                        else if(msStr.length === 2) ms = parseInt(msStr,10) * 10;
                        else ms = parseInt(msStr,10);
                    }
                    times.push(min*60 + sec + ms/1000 + offsetSec);
                    consumed = tagRe.lastIndex;
                }
                if(!times.length) continue;   // 元数据行 / [offset:] 行
                var txt = seg.slice(consumed).trim();
                if(!txt) continue;            // 纯时间标签的空行
                for(var ti=0; ti<times.length; ti++) lines.push({time:times[ti], text:txt});
            }
            lines.sort(function(a,b){ return a.time - b.time; });
            return lines;
        }
        function loadOffsets(){

        var lyricMemory = {};

        /** 把播放列表中的某一行滚动到容器顶部（当前播放行 / TV 焦点行始终置顶）。

            var maxScroll = box.scrollHeight - box.clientHeight;

        /** 显示/隐藏播放列表（表头随列表一起收起）。默认展开，由控制栏最右的「列表」按钮切换。

        function listToggle(){
            listHidden = !listHidden;
            document.body.classList.toggle('list-hidden', listHidden);
            var btn = $('listBtn');
            if(btn){
                btn.setAttribute('aria-expanded', listHidden ? 'false' : 'true');
                btn.title = listHidden ? '显示歌曲列表' : '隐藏歌曲列表';
            }
            if(isTv){
                // 折叠后列表行 display:none，电视焦点不能留在不可见元素上
                if(listHidden && focusEl && focusEl.classList.contains('li')){
                    remoteFocus(btn || $('playBtn'));
                }
                layoutTvList(function(){
                    // 电视卡片/列表高度是异步重算的，必须等布局落地后再置顶，否则滚动位置算错
                    if(!listHidden){
                        var onRow = focusEl && focusEl.classList.contains('li') && $('listBox').contains(focusEl);
                        if(onRow) scrollListRowToTop(focusEl);   // 与 renderList 的 afterBuild 保持一致
                        else { scrollCurRowToTop(); if(focusEl && document.body.contains(focusEl)) focusScroll(focusEl); }
                    } else if(focusEl && document.body.contains(focusEl)){
                        focusScroll(focusEl);
                    }
                });
            } else if(!listHidden){
                // 展开后把当前播放行重新置顶（隐藏期间的置顶计算得到的是 0）
                scrollCurRowToTop();
            }
            showStatus(listHidden ? '已隐藏歌曲列表' : '已显示歌曲列表');
        }

        function pick(i){
            curIndex = i;
            loadCurrent(true);
            // 电视焦点：切歌列表重建后，把焦点环还给当前选中行
            if(isTv){
                setTimeout(function(){
                    var row = document.querySelector('.li[data-idx="' + i + '"]');
                    if(row) remoteFocus(row);
                }, 100);
            }
        }
        function togglePlay(){
            var s = songList[curIndex];
            alog('user:togglePlay paused=' + audio.paused);
            /* 用户已经介入：预热立即收尾，别让"静音预热"把用户的播放/暂停听感也吞掉 */
            if(warm.active && !warm.ended){ warmFinish('user-toggle'); }
            // 上一次因音源全部失败而中断（audio.error 非空）时，"播放"应按"重试"处理：
            // 从候选链第一项重新开始，而不是对着一个已经失效的 src 再 play 一次。
            if(audio.src && audio.error && s){
                s.srcPos = -1;
                markWantPlay(true);
                applyPlaySource(s, playToken, true);
                return;
            }
            if(audio.src){
                if(audio.paused){ markWantPlay(true); safePlay(); }
                else { markWantPlay(false); audio.pause(); }   // 用户主动暂停：先落标记，避免被动恢复把它拉回
            } else {
                loadCurrent(true);
            }
        }
        function playPrev(){ if(songList.length){ curIndex=(curIndex-1+songList.length)%songList.length; loadCurrent(true);} }
        function playNext(){
            if(!songList.length) return;
            if(playMode===2){
                var r;
                if(songList.length===1){ r = 0; }
                else { do { r = Math.floor(Math.random()*songList.length); } while(r === curIndex); }
                curIndex = r;
            } else {
                curIndex = (curIndex+1) % songList.length;
            }
            loadCurrent(true);
        }
        function toggleVol(){
            muted = !muted;
            volState.muted = muted;
            /* 用户主动切静音 = 用户已经介入，预热立刻收尾（否则会一直静音听不到反馈） */
            if(warm.active && !warm.ended){ warmFinish('user-mute'); }
            applyVol();
            setMuteIcon(muted);
            showStatus(muted ? '已静音' : '取消静音');
        }
        var verifyingIndex = -1;
        function removeSong(i){
            if(i<0 || i>=songList.length) return false;
            songList.splice(i,1);
            if(curIndex > i) curIndex--;
            else if(curIndex === i) curIndex = Math.min(curIndex, songList.length-1);
            renderList();
            return true;
        }
        var playToken = 0;   // 播放序号，防止 song/url、歌词异步返回时串歌
        var checkedLrcSync = false;
        // 歌词与音频时长粗校验：音频明显短于歌词末行时间戳 → 试听版/不同版本，提示可能不同步（每首歌仅一次）
        function checkLrcSync(){
            if(checkedLrcSync) return;
            var l = lrcLines;
            if(!l.length) return;
            var d = audio.duration;
            if(!isFinite(d) || d <= 0) return;   // 时长还没拿到：这次不算数，等 loadedmetadata/canplay 再来
            checkedLrcSync = true;               // 旧实现只在"命中不同步"时才落锁，正常歌曲每次 play 都会重算一遍
            var lastT = l[l.length-1].time;
            if(d < lastT - 3){
                showStatus('提示：此歌可能是试听版或不同版本，歌词可能不同步，可手动“+/−”微调或“换词”', true);
            }
        }
        function playCurrent(s, autoplay){
            if(oneShotStatus){ showStatus(''); oneShotStatus = false; }
            $('songName').textContent = s.name || '未知';
            $('songArtist').textContent = s.artist || '';
            reportPlaybackState();
            var tk = ++playToken;
            // 切歌时立即清空旧歌词，避免新歌词异步加载期间残留上一首歌的歌词（"选新歌却显示旧歌歌词"）
            lrcLines = [];
            lrcEls = [];          // 强制 updateLrc 重建歌词 DOM（新旧歌词行数相同时也要重建）
            refreshOffsetDisplay();
            updateLrc(0);
            // 播放地址候选链：qijieya → injahow 镜像 → gdstudio 直链，任一失败自动换下一个
            s.playUrls = buildPlayUrls(s);
            s.srcPos = -1;
            applyPlaySource(s, tk, autoplay);
            applyCover(s, tk);
            loadLyricForSong(s, tk);
            renderList();
            refreshOffsetDisplay();
        }

        /* ===== v1.20：自动播放等缓冲就绪再起播 =====
           qj / ij 的 type=url 是 302 跳转到真实音频，gd 还要先取一次 JSON 才拿到直链。
           旧实现 audio.src = c.u 之后立刻 play()：探针实测 play 事件发生在 readyState=0，
           24ms 后才 loadeddata/playing。Android WebView 的媒体栈会在这个「重定向/缓冲
           未完成」的窗口里先输出很短的一声，随后中止（pause），再由 pause 自愈
           scheduleResume(400) 补播，加上重新缓冲约 0.5~1 秒 —— 真机表现正是
           「启动先响一声、停顿 1 秒左右再正常播放」。
           现在改为等 canplay / loadeddata（已有可播放数据）再 play，一次连续出声；
           带 playToken 校验防止旧源的异步回调误触发，3 秒兜底避免个别内核不派发 canplay。 */
        var readyPlayTk = 0;
        var readyPlayTimer = null;
        var readyPlayCleanup = null;
        var readyPlayProbeDone = false;   // 兜底探测只做一次，避免音源失败时连弹多条错误提示
        /* 已缓冲到未来多少秒（相对 currentTime）。readyState=3 只说明"有将来数据"，
           302 直链刚连上时缓冲往往只有零点几秒 —— 这种时候出声，缓冲立刻耗尽，
           于是"响一下 → 静音等缓冲 → 再继续"。起播门槛必须连缓冲深度一起看。 */
        function bufferedAhead(){
            try{
                var b = audio.buffered;
                if(!b || !b.length) return 0;
                var end = b.end(b.length - 1);
                if(!isFinite(end)) return 0;
                return end - (audio.currentTime || 0);
            }catch(e){ return 0; }
        }
        /* v1.21：起播门槛从"canplay 就 play"改为"轮询缓冲深度"。
           旧实现两个坑：
           ① 500ms 兜底会直接 safePlay() —— 302 重定向窗口里 readyState 还是 0，
              这一声 play 就是启动时"先响一下"的来源（而且是全局只做一次的探测，
              所以这个现象只在启动第一首出现）；
           ② canplay(readyState=3) 不代表缓冲够，出声后立刻断粮。
           现在每 150ms 检查一次：readyState>=3 且缓冲领先 1.2 秒才起播；
           4 秒后门槛放宽到 0.5 秒，8 秒后只要有可播放数据就起播（宁可晚一点也不能不响）。
           全程不提前 play()，所以不会再出现"响一下就停"。 */
        function armReadyPlay(tk){
            if(readyPlayCleanup){ readyPlayCleanup(); readyPlayCleanup = null; }
            if(readyPlayTimer){ clearInterval(readyPlayTimer); readyPlayTimer = null; }
            readyPlayTk = tk;
            /* 旧实现里 safePlay() 紧跟在 audio.src 之后，会立刻派发 play 事件把
               verifyingIndex 置 -1。现在 play 延后到缓冲就绪，若不补这一句，音源失败时
               skipFailedSong 会把「从未成功起播」误判成启动验证失败，每 300ms 删一首歌、
               反复重建列表 —— 手机端还会把用户刚点出的输入焦点一起带跑。 */
            verifyingIndex = -1;
            var fired = false;
            var waited = 0;
            function finish(){
                if(readyPlayTimer){ clearInterval(readyPlayTimer); readyPlayTimer = null; }
                readyPlayCleanup = null;
            }
            function go(){
                if(fired || tk !== playToken || tk !== readyPlayTk) return;
                fired = true;
                finish();
                alog('arm:go rs=' + audio.readyState + ' buf=' + bufferedAhead().toFixed(2));
                safePlay();
            }
            readyPlayCleanup = finish;
            readyPlayTimer = setInterval(function(){
                if(fired || tk !== playToken || tk !== readyPlayTk){ finish(); return; }
                if(audio.error){ finish(); return; }        // 有错就交给 error 事件换源，别在这儿硬播
                waited += 150;
                var need = (waited < 4000) ? 1.2 : (waited < 8000 ? 0.5 : 0);
