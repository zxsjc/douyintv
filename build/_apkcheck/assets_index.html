                if(audio.readyState >= 3 && bufferedAhead() >= need){ go(); return; }
                if(waited >= 8000 && !fired){
                    if(audio.readyState >= 2){ go(); return; }
                    /* 8 秒连元数据都没有：说明这个内核根本没在预载（load() 没生效或被节流），
                       此时"提前 play"是唯一能推动媒体栈的办法 —— 只做一次，并挂上手势兜底。 */
                    if(!readyPlayProbeDone){ readyPlayProbeDone = true; armGestureResume(); finish(); safePlay(); }
                }
            }, 150);
        }

        /**
         * 按候选链依次尝试播放地址。
         * gdstudio 的 types=url 返回 JSON（{"url":"https://..."}），需要先取到真实地址再交给 audio。
         * 注意：srcPos 是靠"失败一次前进一格"驱动的，所以每个失败点都必须只前进一次，
         * 这里用 s._advancing 防止 getText 回调重入导致的连跳。
         */
        function applyPlaySource(s, tk, autoplay){
            if(!s || !s.playUrls || !s.playUrls.length){ skipFailedSong(); return false; }
            if(s._advancing){ return true; }          // 同一次失败只前进一格
            var pos = (typeof s.srcPos === 'number' ? s.srcPos : -1) + 1;
            if(pos >= s.playUrls.length){ skipFailedSong(); return false; }
            s.srcPos = pos;
            var c = s.playUrls[pos];
            alog('src:' + c.key + ' autoplay=' + (autoplay ? 1 : 0));
            if(!c.json){
                curSrcLabel = c.label;
                audio.src = c.u;
                /* 显式 load()：部分 Android WebView 对 preload 属性偷懒，只有被 play() 推一下
                   才开始拉流；而本版起播要等缓冲，不主动拉就会一直停在 readyState 0。
                   load() 只预载，不出声。 */
                try{ audio.load(); }catch(e){}
                if(autoplay) armReadyPlay(tk);   // v1.21：等缓冲深度够了再播（旧版是「canplay 就播」）
                return true;
            }
            s._advancing = true;
            getText(c.u, function(raw){
                s._advancing = false;
                if(tk !== playToken) return;
                var real = '';
                try{
                    var o = JSON.parse(raw) || {};
                    real = o.url || (o.data && o.data.url) || '';
                }catch(e){}
                if(!real){ noteSrc(c.key, false); applyPlaySource(s, tk, autoplay); return; }
                curSrcLabel = c.label;
                audio.src = real;
                try{ audio.load(); }catch(e){}
                if(autoplay) armReadyPlay(tk);   // v1.21：同上
            }, 6000);
            return true;
        }

        /** 从各种封面地址里抽出网易云的"图片 id"。
            两种形态都要认：
              · 接口地址  https://api.qijieya.cn/meting/?server=netease&type=pic&id=109951174206326909
              · 直链地址  https://p1.music.126.net/qnQ93WnZHACVvIM14c4sAQ==/109951163984007061.jpg
            图片 id 是取封面的唯一正确凭据 —— 网易云图片路径的文件名就是它。 */
        function extractPicId(u){
            var t = String(u || '');
            var m = t.match(/[?&]id=(\d+)/);
            if(m) return m[1];
            m = t.match(/\/(\d{8,})\.(?:jpg|jpeg|png|webp)/i);
            return m ? m[1] : '';
        }

        /**
         * 取封面。按"谁知道真地址"分三级，而不是按"哪个域名先试"。
         *
         * 关键事实（实测）：网易云图片地址形如 p2.music.126.net/{hash}/{图片id}.jpg，
         * 文件名是**图片 id**，不是歌曲 id。用歌曲 id 拼出来的地址一律 404：
         *     types=pic&id=32701152（歌曲 id）        → p2.../32701152.jpg        → 404
         *     types=pic&id=7954966627607511（图片 id）→ p2.../7954966627607511.jpg→ 200 / 16 KB
         * 旧代码全程用歌曲 id，所以「按歌手搜索」来的歌封面时有时无 ——
         * 搜索走 gdstudio，它返回的 pic_id 才是真凭据，但旧代码把它的
         * JSON 响应地址（application/json）直接塞给了 img.src，必然失败；
         * 兜底又退回用歌曲 id 猜，也是 404。歌单/排行榜走 Meting，地址里本身就带图片 id，
         * 所以那条路一直正常。这就是"歌单有封面、搜索时好时坏"的全部原因。
         *
         * 三级策略：
         *   1) s.picUrl 已解析过 → 直接用
         *   2) s.picId（图片 id）→ 向 gdstudio 换真实地址（唯一"确定正确"的路径）
         *   3) 兜底猜：s.pic 直连 / qijieya / injahow（每条 126.net 地址自动换 p1~p4 子域）
         */
        function applyCover(s, tk){
            var img = $('pic').querySelector('img');
            var picBox = $('pic');
            // 封面按"初始网易云 id"取：换过词后 s.id 会变成歌词版本的 id，不能拿它当歌曲身份
            var id = s._origId || s.urlId || s.id || '';
            var picId = s.picId || extractPicId(s.pic);
            var startedAt = Date.now();

            function paint(u){
                if(tk !== playToken) return;
                s.picUrl = u;
                img.onerror = function(){};
                img.src = u;
                img.style.display = 'block';
                picBox.classList.remove('no-cover');
            }
            function fail(){
                if(tk !== playToken) return;
                img.style.display = 'none';
                img.removeAttribute('src');
                // 不再依赖外链 11.jpg（很多壳里根本没这个文件，结果就是个灰洞）
                picBox.style.backgroundImage = 'none';
                picBox.classList.add('no-cover');
            }
            /** 候选地址列表；每条 126.net 地址自动展开成 p1~p4 子域变体 */
            function buildList(){
                var list = [], seen = {};
                function add(u){
                    if(!u) return;
                    var t = String(u);
                    if(seen[t]) return;
                    seen[t] = 1;
                    list.push(t);
                    var m = t.match(/^(https?:\/\/)p(\d)(\.music\.126\.net\/.+)$/);
                    if(!m) return;
                    for(var k=1;k<=4;k++){
                        if(k === Number(m[2])) continue;
                        var v = m[1] + 'p' + k + m[3];
                        if(!seen[v]){ seen[v] = 1; list.push(v); }
                    }
                }
                // gdstudio 的 pic 接口地址返回 JSON，不能当图片用，跳过
                if(s.pic && !/gdstudio\.xyz/.test(s.pic)) add(s.pic);
                if(id){
                    add(SRC.qj.pic(id));
                    add(SRC.ij.pic(id));
                }
                return list;
            }
            /** 预加载探测：成功才回调，避免把坏地址显示出来再闪一下 */
            function probeList(list, cb){
                var i = 0;
                (function step(){
                    if(tk !== playToken) return;
                    if(i >= list.length || Date.now() - startedAt > 12000){ cb(''); return; }
                    var u = list[i++];
                    var p = new Image();
                    p.onload = function(){ if(tk === playToken) cb(u); };
                    p.onerror = function(){ step(); };
                    p.src = u;
                })();
            }
            /** 最后一搏：官方 song/detail（浏览器直连多半被 CORS 拦，聊胜于无） */
            function lastResort(){
                if(!id){ fail(); return; }
                getText('https://music.163.com/api/song/detail?ids=%5B' + encodeURIComponent(id) + '%5D', function(txt){
                    if(tk !== playToken) return;
                    var u = '';
                    try{
                        var o = JSON.parse(txt) || {};
                        var so = (o.songs && o.songs[0]) || {};
                        u = (so.album && so.album.picUrl) || '';
                    }catch(e){}
                    if(!u){ fail(); return; }
                    probeList([u], function(ok){ if(ok) paint(ok); else fail(); });
                }, 6000);
            }
            function guess(){
                probeList(buildList(), function(ok){
                    if(ok){ paint(ok); return; }
                    lastResort();
                });
            }

            // 1) 上一轮已解析出真实地址
            if(s.picUrl){
                probeList([s.picUrl], function(ok){
                    if(ok){ paint(ok); return; }
                    s.picUrl = '';   // 缓存失效，重新解析
                    guess();
                });
                return;
            }
            // 2) 有图片 id：先用 qijieya 的 pic 接口直接取。
            //    它按图片 id 302 到真实图片地址，<img> 自动跟随跳转，不需要解析 JSON，
            //    也不会撞上 gdstudio 的 Cloudflare 限流（实测连发会被 503，导致整批封面空白）。
            if(picId){
                probeList([SRC.qj.pic(picId)], function(ok){
                    if(ok){ paint(ok); return; }
                    // 2b) qijieya 这条路不通，再向 gdstudio 要真实地址（JSON）
                    getText('https://music-api.gdstudio.xyz/api.php?types=pic&source=netease&id=' + encodeURIComponent(picId), function(txt){
                        if(tk !== playToken) return;
                        var u = '';
                        try{ var o = JSON.parse(txt) || {}; u = o.url || (o.data && o.data.url) || ''; }catch(e){}
                        if(!u){ guess(); return; }
                        probeList([u], function(ok2){
                            if(ok2){ paint(ok2); return; }
                            guess();
                        });
                    }, 6000);
                });
                return;
            }
            // 3) 不知道图片 id：只能猜
            guess();
        }

        /** gdstudio 的 lyric 接口返回 {"lyric":"[00:00.000]..."}，其余源返回裸 LRC 文本。 */
        function parseLrcPayload(txt){
            if(!txt) return '';
            var t = String(txt);
            if(t.indexOf('"lyric"') >= 0){
                try{
                    var o = JSON.parse(t);
                    if(o && typeof o.lyric === 'string') return o.lyric;
                }catch(e){}
            }
            return t;
        }

        /** 歌词拉取回退链：qijieya → injahow → gdstudio（后者返回 JSON）；全空时回调空数组 */
        function fetchLrcChain(id, tk, cb){
            if(!id){ cb([]); return; }
            var chain = [SRC.qj.lrc(id), SRC.ij.lrc(id), SRC.gd.lrc(id)];
            var pos = 0;
            function next(){
                if(tk !== undefined && tk !== playToken) return;
                if(pos >= chain.length){ cb([]); return; }
                var url = chain[pos++];
                getText(url, function(txt){
                    if(tk !== undefined && tk !== playToken) return;
                    var l = parseLrc(parseLrcPayload(txt || ''));
                    if(!l.length){ next(); return; }
                    cb(l);
                }, 7000);
            }
            next();
        }

        /** 播放时装载歌词（带"已应用记忆歌词"提示） */
        function loadLyricForSong(s, tk){
            var id = s.id || s._origId || '';
            fetchLrcChain(id, tk, function(l){
                if(tk !== playToken) return;
                lrcLines = l;
                lrcEls = [];      // 行数相同也要重建 DOM
                refreshOffsetDisplay();
                updateLrc(0);
                checkLrcSync();
                if(l.length && s._memInfo && (s._memInfo.name || s._memInfo.artist)){
                    showStatus('已应用记忆歌词：' + (s._memInfo.name || '') + (s._memInfo.artist ? ' - ' + s._memInfo.artist : ''), true);
                }
            });
        }
        function loadDirect(list){
            list = list || [];
            // 补原始歌曲标识：_origId 始终指向最初加载的网易云 id（换词后 id 会变，但 _origId 不变），用作换词记忆的 key
            for(var oi=0; oi<list.length; oi++){
                if(list[oi] && list[oi]._origId === undefined) list[oi]._origId = list[oi].id || '';
            }
            songList = list;
            renderList();
            if(songList.length){
                curIndex = 0;
                showStatus('已加载 '+songList.length+' 首');
                loadCurrent(true);   // 立即自动播放第一首；短歌/试听版会在播放时自动跳过
            } else {
                showStatus('列表为空');
            }
        }
        var loadCurrent = function(autoplay){
            var s = songList[curIndex];
            if(!s){ showStatus('列表已播完'); return; }
            if(autoplay) markWantPlay(true);       // 自动切歌/启动：期望播放，允许自愈
            verifyingIndex = curIndex;
            checkedLrcSync = false;   // 换歌重置同步检测
            // 自动应用换词记忆：当前歌有记忆的歌词版本，且 id 仍是初始加载的原始 id（未换过词）→ 直接换到记忆歌词
            // 记忆 key 用「歌名|歌手|原始ID」：同名同歌手多版本（原版/Live）精准区分，不同版本各自独立记忆、互不误用
            var okey = (s.name || '') + '|' + (s.artist || '') + '|' + (s._origId || s.id || '');
            var oid0 = s._origId || s.id || '';
            if(okey && lyricMemory[okey] && lyricMemory[okey].id && s.id === oid0 && !s._lyricApplied){
                var mem = lyricMemory[okey];
                s._lyricApplied = true;
                s._memInfo = mem;
                s.id = mem.id;
                // "已应用记忆歌词"提示在 playCurrent 歌词加载完成后显示（避免被过滤状态覆盖）
            }
            playCurrent(s, autoplay);
        };
        /** 一首歌的所有音源都失败后的收尾：多首时自动跳过，只剩一首时明确提示（不删空列表） */
        function skipFailedSong(){
            if(verifyingIndex < 0 || verifyingIndex >= songList.length) return;
            if(songList.length > 1){
                var i = verifyingIndex;
                verifyingIndex = -1;
                removeSong(i);
                showStatus('全部音源均不可用，已自动跳过该曲');
                setTimeout(function(){ loadCurrent(true); }, 300);
            } else {
                var s = songList[curIndex];
                verifyingIndex = -1;
                showStatus('《' + ((s && s.name) || '当前歌曲') + '》加载失败：三个音源均不可用，可换一首或换歌单', true);
            }
        }

        audio.addEventListener('error', function(){
            var cur = songList[curIndex];
            // 先尝试同曲的其它音源（按健康度排序后的候选链）
            if(cur && cur.playUrls && (cur.srcPos + 1) < cur.playUrls.length){
                var bad = cur.playUrls[cur.srcPos];
                if(bad) noteSrc(bad.key, false);      // 记一笔失败，下次这个源自动后置
                var nxt = cur.playUrls[cur.srcPos + 1];
                showStatus('「' + (cur.name || '当前歌曲') + '」当前音源不可用，切换备用音源：' + nxt.label, true);
                applyPlaySource(cur, playToken, true);
                return;
            }
            if(cur && cur.playUrls && cur.playUrls[cur.srcPos]) noteSrc(cur.playUrls[cur.srcPos].key, false);
            // 播放过程中掉线：play 事件早已把 verifyingIndex 置 -1，skipFailedSong 会直接 return，
            // 用户侧就是"声音没了、界面毫无反应"。这种情况不删歌，只给可见提示并允许重试。
            if(verifyingIndex < 0){
                showStatus('播放中断：「' + ((cur && cur.name) || '当前歌曲') + '」加载失败，点播放键可重试', true);
                return;
            }
            skipFailedSong();
        });
        // 时长往往在 play 之后才就绪（play 时 audio.duration 还是 NaN），
        // 只靠 play/ended 触发 checkLrcSync 会让"试听版不同步"的提示几乎永远不出现。
        audio.addEventListener('loadedmetadata', function(){ checkLrcSync(); });
        audio.addEventListener('canplay', function(){ checkLrcSync(); });
        var rafId = null;
        var raf = window.requestAnimationFrame || function(cb){ return setTimeout(cb, 60); };
        var caf = window.cancelAnimationFrame || function(id){ clearTimeout(id); };
        function lrcLoop(){
            // 旧实现把重排放在函数尾部：updateLrc 里一旦抛异常，raf 链就永久断掉且 rafId 仍为非空，
            // 之后再也不会重新启动 —— 表现为"歌词停在一句上不动，直到切歌"。
            try{
                updateLrc(audio.currentTime);
            }catch(e){
            }finally{
                rafId = raf(lrcLoop);
            }
        }
        audio.addEventListener('play', function(){
            resumeTries = 0;              // 已成功出声，恢复重试预算
            verifyingIndex = -1;
            lastAudioOnAt = Date.now();
            checkLrcSync();
            if(!rafId) rafId = raf(lrcLoop);
            reportPlaybackState();
        });
        audio.addEventListener('ended', function(){
            markWantPlay(false);           // 先把自愈标记摘掉，避免 ended 前后的 pause 触发重播本曲末尾
            if(rafId){ caf(rafId); rafId = null; }
            setPicState('');
            reportPlaybackState();
            if(playMode === 1){
                audio.currentTime = 0;
                markWantPlay(true);
                safePlay();
            } else {
                playNext();                // → loadCurrent(true) 会重新置回 true
            }
        });
        audio.addEventListener('playing', function(){
            setPlayIcon(true);
            lastAudioOnAt = Date.now();
            // 记一次"这个源确实能出声"，下次同源优先（只认真的播放成功，而不是"设了 src"）
            var cur = songList[curIndex];
            if(cur && cur.playUrls && cur.srcPos >= 0 && cur.playUrls[cur.srcPos]){
                noteSrc(cur.playUrls[cur.srcPos].key, true);
            }
            setPicState('playing');
            reportPlaybackState();
        });
        audio.addEventListener('pause', function(){
            if(rafId){ caf(rafId); rafId = null; }
            setPlayIcon(false);
            setPicState('paused');
            reportPlaybackState();
            // 非用户主动的暂停（WebView 音频焦点被抢、系统省电策略、游离 audio 被回收等）
            // 表现为「启动响一下就停」：延迟一小段自动续播，用户主动暂停时 wantAutoPlay 已是 false。
            // 刚出声 2.5 秒内就被暂停 = 起播被打断，用 80ms 立刻续上（停顿短到听不出来）；
            // 播放中途被打断才用 400ms，避免和系统焦点切换打架。
            if(wantAutoPlay && audio.src && !audio.ended && !audio.error){
                var sinceOn = lastAudioOnAt ? (Date.now() - lastAudioOnAt) : 999999;
                scheduleResume(sinceOn < 2500 ? 80 : 400);
            }
        });
        audio.addEventListener('timeupdate', function(){
            $('curTime').textContent = fmt(audio.currentTime);
            $('totalTime').textContent = fmt(audio.duration);
            var pct = audio.duration ? (audio.currentTime/audio.duration*100) : 0;
            $('barPlayed').style.width = pct + '%';
            try{ $('bar').setAttribute('aria-valuenow', String(Math.round(pct))); }catch(e){}
            if(lrcLines.length) updateLrc(audio.currentTime);
        });
        // APP 切后台后 WebView 常会暂停媒体；回到前台且仍期望播放时自动续上
        document.addEventListener('visibilitychange', function(){
            if(!document.hidden && wantAutoPlay && audio.src && !audio.error && audio.paused) scheduleResume(250);
        });

        function toggleMode(){
            playMode = (playMode+1) % 3;
            setModeIcon(playMode);
            $('modeBtn').title = modeLabels[playMode];
            showStatus('播放模式：' + modeLabels[playMode]);
        }

        function getLrcIndex(rawPlayTime){
            var t = rawPlayTime + curOffset();
            var low = 0, high = lrcLines.length - 1, bestIdx = -1;
            while(low <= high){
                var mid = (low + high) >> 1;
                if(lrcLines[mid].time <= t){
                    bestIdx = mid;
                    low = mid + 1;
                } else {
                    high = mid - 1;
                }
            }
            // （旧版这里有一段 gap<0.25 的"提前切句"分支，二分查找下条件恒假、永不触发，已删）
            return bestIdx;
        }

        /* 歌词行用 DOM 节点 + textContent 构建，不再拼 HTML 字符串。
           原来的 escHtml 只转义 & < >，不转义引号 —— 在当前上下文（文本节点）是安全的，
           但属于"刚好安全"：一旦有人把这段拼进属性或别的地方就会破。用 textContent 从根上消除这类风险，
           顺带省掉一次 innerHTML 解析，长歌词插入更快。 */
        function renderLrcList(){
            lastLrcIdx = -1;
            lastLrcTarget = 0;
            clearLrcFit();
            var box = $('lrcBox');
            box.style.maxHeight = '';   // 清掉旧版"动态撑高"可能残留的内联值
            var frag = document.createDocumentFragment();
            for(var k=0;k<lrcLines.length;k++){
                var d = document.createElement('div');
                d.className = 'lrc-line';
                d.setAttribute('data-i', String(k));
                d.textContent = lrcLines[k].text || '♪';
                frag.appendChild(d);
            }
            box.innerHTML = '';
            box.appendChild(frag);
            lrcEls = Array.prototype.slice.call(box.querySelectorAll('.lrc-line'));
            // 新节点默认没有 tabindex，WebView 的原生焦点可能落到歌词文本上；
            // disableLyricFocus 只在启动时跑过一次，这里补一次，保证"焦点在哪"与"框在哪"始终一致
            disableLyricFocus();
        }
        var scrollRaf = null;
        var lastLrcTarget = 0;       // 切句时算好的定位目标；同一句内不再读布局
        /* 超长歌词（如小品《卖拐》整段台词）：容器高度恒定，不能撑高，就把当前句字号
           按比例缩小，尽量让整句一次看全；缩到下限仍放不下时，容器内部可滚动查看，
           绝不影响下方布局。只在切句时执行一次，不进每帧循环。 */
        var fittedLrcEl = null;
        function clearLrcFit(){
            if(fittedLrcEl){
                fittedLrcEl.style.fontSize = '';
                fittedLrcEl.style.lineHeight = '';
                fittedLrcEl = null;
            }
        }
        function fitLongLyric(el, box){
            clearLrcFit();
            var viewH = box.clientHeight;
            var pad = 12;
            if(!viewH) return;
            var rowH = el.offsetHeight;
            if(rowH + pad <= viewH) return;            // 常规句子不动
            var base = parseFloat(window.getComputedStyle(el).fontSize) || 14;
            var minFs = 10;
            var fs = Math.max(minFs, Math.floor(base * (viewH - pad) / rowH * 10) / 10);
            for(var n = 0; n < 3; n++){
                // 只缩字号、不动 line-height：行高保持 20px 整数、行盒仍是 24px 整数倍，
                // 否则自定义的小数行高又会引入亚像素裁切。
                el.style.fontSize = fs + 'px';
                var h = el.offsetHeight;
                if(h + pad <= viewH) break;
                var next = Math.max(minFs, Math.floor(fs * (viewH - pad) / h * 10) / 10);
                if(next >= fs || next <= minFs){ fs = minFs; el.style.fontSize = fs + 'px'; break; }
                fs = next;
            }
            fittedLrcEl = el;
        }
        function smoothScrollTo(box, target){
            // 上一段滚动动画必须先取消：连续切句时多个 raf 循环同时改 scrollTop 会抖动
            if(scrollRaf){ caf(scrollRaf); scrollRaf = null; }
            target = Math.round(target);       // 终值必须是整数，否则裁剪线落在半像素上
            var start = box.scrollTop;
            var diff = target - start;
            if(Math.abs(diff) < 2){ box.scrollTop = target; return; }
            var dur = 450, t0 = null;
            function step(ts){
                // 按时间戳推进，不按帧数：旧版 cur+=16 假设 60fps，120Hz 屏上动画会瞬跳
                var now = (typeof ts === 'number') ? ts : Date.now();
                if(t0 === null) t0 = now;
                var p = Math.min(1, (now - t0) / dur);
                var ease = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2;   // easeInOutCubic
                // 每帧也取整：动画过程中的小数 scrollTop 会让汉字被裁成上下两半
                box.scrollTop = Math.round(start + diff * ease);
                if(p < 1){ scrollRaf = raf(step); }
                else { scrollRaf = null; box.scrollTop = target; }
            }
            scrollRaf = raf(step);
        }
        /* 当前句定位：容器高度恒定，绝不动态撑高（那会让下方控制区/歌单反复重排闪动，
           句子极长时还会把 .p-fixed 顶出卡片）。先按比例缩小当前句字号让整句尽量看全；
           缩到下限仍放不下就贴顶，从第一行开始完整可读，用户可在歌词区内下滑看完整句。

           v1.11：把 scrollTop 吸附到「某一行的顶部边界」。三端 clientHeight 都是 24px
           行盒的整数倍，行盒高度也都是整数，因此 scrollTop 取行顶时，容器上边缘与
           下边缘都恰好落在行与行之间的空隙里 —— 汉字不会被横向裁成上下两半。 */
        function lrcTargetScroll(box, curEl){
            fitLongLyric(curEl, box);          // 只改当前句字号，不动容器高度
            var rowH = curEl.offsetHeight || 0;
            var pad = 12;                      // 上下 padding + 余量
            var viewH = box.clientHeight;
            var ideal;
            if(rowH + pad > viewH){
                ideal = Math.max(0, curEl.offsetTop - 6);   // 超长句：贴顶，从第一行完整开始
            } else {
                ideal = curEl.offsetTop - viewH/2 + rowH/2;
                if(ideal < 0) ideal = 0;
            }
            // 吸附到最接近居中的「行顶边界」：clientHeight 是 24px 行盒的整数倍，
            // 因此上下边缘都落在行间隙，常规歌词不会被裁成半截字。
            // 极端长句换行时边缘仍可能压到字，由 .p-lrc 的上下渐隐遮罩淡出兜底。
            var best = Math.round(ideal), bestDist = Infinity;
            for(var i=0;i<lrcEls.length;i++){
                var t = lrcEls[i].offsetTop;
                var d = Math.abs(t - ideal);
                if(d < bestDist){ bestDist = d; best = t; }
            }
            var maxScroll = Math.max(0, box.scrollHeight - viewH);
            if(best > maxScroll) best = maxScroll;
            return Math.round(best);
        }
        function updateLrc(playTime){
            var box = $('lrcBox');
            if(!lrcLines.length){
                // 只在显示的不是"暂无歌词"占位时才重建（切歌/换词后 lrcEls 已清空，靠内容判断）
                var first = box.querySelector('.lrc-line');
                var isPlaceholder = box.children.length === 1 && first && first.textContent === '暂无歌词';
                if(!isPlaceholder){
                    clearLrcFit();
                    box.style.maxHeight = '';
                    box.innerHTML = '<div class="lrc-line far">暂无歌词</div>';
                    lrcEls = [];
                }
                return;
            }
            if(lrcEls.length !== lrcLines.length) renderLrcList();
            var idx = getLrcIndex(playTime);
            if(idx < 0) idx = 0;
            if(idx >= lrcLines.length) idx = lrcLines.length - 1;

            var curEl = lrcEls[idx];
            if(idx !== lastLrcIdx){
                // 切句时才刷新高亮和滚动：原实现每帧（60fps）遍历全部歌词节点写 className，
                // 长歌词会持续触发样式重算，是歌词滚动卡顿的主因
                var i;
                for(i=0;i<lrcEls.length;i++){
                    var cls = 'lrc-line';
                    if(i===idx) cls += ' cur';
                    else if(Math.abs(i-idx)===1) cls += ' near';
                    else cls += ' far';
                    lrcEls[i].className = cls;
                }
                if(curEl){
                    lastLrcTarget = lrcTargetScroll(box, curEl);
                    smoothScrollTo(box, lastLrcTarget);
                }
                lastLrcIdx = idx;
            } else if(curEl){
                // 同一句但偏离过大（拖动进度条/切歌等）：用切句时缓存的目标直接定位。
                // 这里绝不读布局、绝不改样式 —— 每帧重排会让歌词容器以下的部分闪动。
                if(Math.abs(box.scrollTop - lastLrcTarget) > 80){ box.scrollTop = lastLrcTarget; }
            }
        }

        function seekByClientX(clientX){
            var r = $('bar').getBoundingClientRect();
            if(!r.width) return;                 // 列表隐藏/布局未完成时宽度为 0，会把 ratio 算成 Infinity
            var ratio = (clientX - r.left) / r.width;
            if(ratio < 0) ratio = 0;
            if(ratio > 1) ratio = 1;
            if(audio.duration) audio.currentTime = ratio * audio.duration;
        }
        /* 进度条：点按 + 拖动。
           旧实现只监听 click / touchstart，标题却写着"拖动调整播放进度" —— 手指拖动时既不会 seek
           也不会阻止页面滚动，真机上表现为"一拖整页跟着上下滑"。 */
        (function(){
            var bar = $('bar');
            var dragging = false;
            function pointX(e){
                var t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
                return t ? t.clientX : e.clientX;
            }
            function down(e){
                if(pointX(e) === undefined) return;
                dragging = true;
                seekByClientX(pointX(e));
            }
            function move(e){
                if(!dragging) return;
                if(e.cancelable) e.preventDefault();   // 拖动时不要让页面/列表跟着滚
                seekByClientX(pointX(e));
            }
            function up(){ dragging = false; }
            bar.addEventListener('mousedown', down, false);
            bar.addEventListener('touchstart', down, { passive: true });
            document.addEventListener('mousemove', move, false);
            document.addEventListener('touchmove', move, { passive: false });
            document.addEventListener('mouseup', up, false);
            document.addEventListener('touchend', up, false);
            document.addEventListener('touchcancel', up, false);
            bar.addEventListener('click', function(e){
                if(dragging) return;               // 拖动结束的那次 click 已经在 move 里 seek 过了
                seekByClientX(e.clientX);
            }, false);
        })();

        function loadPlaylist(){
            var id = parsePlaylistId($('playlistId').value);
            if(!id){ showStatus('请输入有效的歌单ID或链接'); return; }
            hideError();
            hideKb();
            showStatus('正在加载 '+id+' ...');
            // 歌单/排行榜：qijieya 主源 + injahow 镜像并行抢占，先返回非空结果的胜出
            //（gdstudio 无歌单接口，不参与）
            var done = false;
            // 两家都支持歌单，按健康度排序：上次成功的那家先试，减少"先撞一次挂掉的源"的空等
            var plan = [
                { key: 'ij', label: SRC.ij.label, url: SRC.ij.playlist(id) },
                { key: 'qj', label: SRC.qj.label, url: SRC.qj.playlist(id) }
            ].sort(function(a, b){ return srcScore(b.key) - srcScore(a.key); });
            var pending = plan.length;
            function finishEmpty(){
                if(done) return;
                done = true;
                showError('歌单加载失败，请确认是有效的歌单/排行榜ID，或换一首/换源');
            }
            for(var p=0;p<plan.length;p++){
                (function(src){
                    getText(src.url + '&r=' + Math.random(), function(raw){
                        if(done) return;
                        var a = parseMeting(raw);
                        if(a.length){
                            done = true;
                            noteSrc(src.key, true);
                            showStatus('已加载歌单 '+a.length+' 首（来源：'+src.label+'）', true);
                            loadDirect(a);
                            return;
                        }
                        noteSrc(src.key, false);
                        if(--pending <= 0) finishEmpty();
                    }, 6000);
                })(plan[p]);
            }
        }
        /* 用歌曲ID加载单曲。
           旧实现是空壳：只打一句提示就转去 loadPlaylist()，而歌单接口拿到歌曲 id 必然返回空，
           于是"粘贴歌曲分享链接"永远只会得到"歌单加载失败"。
           这里真正走一次官方 song/detail（封面回退链里本来就在用同一个接口），失败再交给 onFail。 */
        function loadSongById(id, onFail){
            if(!id){ if(typeof onFail === 'function') onFail(); return; }
            showStatus('正在按歌曲ID加载：' + id + ' ...');
            getText('https://music.163.com/api/song/detail?ids=%5B' + encodeURIComponent(id) + '%5D', function(raw){
                var list = parseNeteaseSongs(raw);
                if(list.length){ hideError(); loadDirect(list); return; }
                showStatus('未取到该歌曲，按歌单/排行榜再试：' + id);
                if(typeof onFail === 'function') onFail(); else loadPlaylist();
            }, 6000);
        }

        var searchSeq = 0;
        // 解析 Meting 风格返回（qijieya / injahow 通用）：[{name,artist,url,pic}]
        // url 字段里带的是同源 url 接口地址，这里只取其中的歌曲 id，播放/歌词统一按 id 走候选链
        // （原结构里的 lrc / dur 字段从来没有被读取过：歌词按 id 重新拉，时长以 audio 元数据为准，已删）
        function parseMeting(raw){
            var items = [];
            try{
                var arr = JSON.parse(raw);
                if(Object.prototype.toString.call(arr) !== '[object Array]') return items;
                for(var i=0;i<arr.length;i++){
                    var s = arr[i];
                    if(!s) continue;
                    var name = s.name || s.title || '';
                    var artist = s.artist || s.author || '';
                    if(Object.prototype.toString.call(artist) === '[object Array]') artist = artist.join('/');
                    var rawUrl = s.url || '';
                    var m = rawUrl.match(/id=(\d+)/);
                    var qid = m ? m[1] : (s.id ? String(s.id) : '');
                    if(!qid) continue;
                    var mp = s.pic || '';
                    items.push({
                        id: qid, urlId: qid, name: name, artist: artist,
                        url: SRC.qj.url(qid),
                        pic: mp,
                        picId: extractPicId(mp)   // Meting 的 pic 地址里带的就是图片 id
                    });
                }
            }catch(e){}
            return items;
        }

        // 解析 gdstudio 搜索结果（artist 为数组，封面要用 pic_id）
        function parseGdstudio(raw){
            var items = [];
            try{
                var arr = JSON.parse(raw);
                if(Object.prototype.toString.call(arr) !== '[object Array]') return items;
                for(var i=0;i<arr.length;i++){
                    var s = arr[i];
                    if(!s) continue;
                    var artist = s.artist;
                    if(Object.prototype.toString.call(artist) === '[object Array]') artist = artist.join('/');
                    var id = String(s.url_id || s.id || '');
                    if(!id) continue;
                    // pic_id 是这张专辑图的图片 id，取封面必须用它（用歌曲 id 拼必 404）。
                    // 不再把 SRC.gd.pic() 的 JSON 地址塞进 pic —— 那是 application/json，img 加载不了。
                    var picId = s.pic_id ? String(s.pic_id) : '';
                    items.push({
                        id: id, urlId: String(s.url_id || id),
                        name: s.name || '', artist: artist || '',
                        url: SRC.qj.url(id),
                        pic: '',
                        picId: picId
                    });
                }
            }catch(e){}
            return items;
        }
        // 网易云官方接口的单曲 → 内部曲目结构（播放/歌词走候选链）
        // 注意：官方 search/song/detail 的 album 里只有 picId（长数字，就是网易云图片 id），
        //       没有 picUrl。必须把 picId 原样交给 applyCover 走 qijieya pic 直连，
        //       否则封面会退化成"拿歌曲 id 瞎猜"，出现整批空白。
        function songItemFromNetease(s){
            if(!s || !s.id) return null;
            var id = String(s.id);
            var artist = '';
            if(s.artists && s.artists.length){
                var ar = [];
                for(var k=0;k<s.artists.length;k++){ if(s.artists[k] && s.artists[k].name) ar.push(s.artists[k].name); }
                artist = ar.join('/');
            }
            var cp = (s.album && s.album.picUrl) || '';
            var pid = '';
            if(s.album && s.album.picId) pid = String(s.album.picId);
            else pid = extractPicId(cp);
            return { id: id, urlId: id, name: s.name || '', artist: artist,
                     url: SRC.qj.url(id),
                     pic: cp,
                     picId: pid };
        }
        // 兼容 {songs:[…]}（song/detail）与 {result:{songs:[…]}}（search）两种返回
        function parseNeteaseSongs(raw){
            var items = [];
            try{
                // 官方接口的 album.picId 是 19 位十进制数字，JSON.parse 会按 IEEE754 双精度
                // 丢掉末尾几位（实测 109951163038292176 → 109951163038292180），图片 id 一错
                // 封面就会整批空白。解析前先把超长数字字段加上引号变成字符串。
                var safe = String(raw || '').replace(/("picId"\s*:\s*)(\d{15,})/g, '$1"$2"');
                var o = JSON.parse(safe) || {};
                var songs = o.songs || (o.result && (o.result.songs || o.result.tracks)) || [];
                for(var i=0;i<songs.length;i++){
                    var it = songItemFromNetease(songs[i]);
                    if(it) items.push(it);
                }
            }catch(e){}
            return items;
        }
        /* 搜索源优先级（用户指定：官方优先，qijieya 兜底）：
           1) 网易云官方 web 搜索 —— 数据最全，一次上限 100 首，且带专辑 picId（封面更准）。
              但它没有 Access-Control-Allow-Origin，浏览器直连常被 CORS 拦；加 callback 还会
              触发风控 code -462。所以只给它一个很短的「优先窗口」：窗口内拿到结果就优先采用，
              失败/空结果立刻放行备源，慢网络挂起也最多只等 1200ms，不拖慢搜索。
           2) qijieya（主备源）与 gdstudio 并行竞速，谁先给出有效列表谁生效。
           injahow 镜像不支持 search。播放/歌词/封面按歌曲 id 走候选链，与搜索来源无关。 */
        var SEARCH_PRIORITY_WAIT = 1200;
        function searchMulti(kw, cb){
            var done = false;
            function finish(list){ if(!done){ done = true; cb(list); } }
            var busy = 0, backupStarted = false;
            function trySource(url, parser){
                if(!url || done) return;
                busy++;
                getText(url, function(raw){
                    busy--;
                    if(done) return;
                    var a = parser(raw);
                    if(a.length){ finish(a); return; }
                    if(busy <= 0 && backupStarted) finish([]);
                }, 7000);
            }
            /** 放行备源：官方失败、空结果或超时都会调用，重复调用由 backupStarted 守卫 */
            function startBackup(){
                if(backupStarted || done) return;
                backupStarted = true;
                trySource(SRC.qj.search(kw) + '&r=' + Math.random(), parseMeting);
                trySource(SRC.gd.search(kw), parseGdstudio);
            }
            var q = encodeURIComponent(kw);
            // 1) 官方源先跑：拿到有效列表就立刻采用，否则马上放行备源
            getText('https://music.163.com/api/search/get/web?csrf_token=&s=' + q +
                    '&type=1&offset=0&total=true&limit=100', function(raw){
                if(done) return;
                var a = parseNeteaseSongs(raw);
                if(a.length) finish(a);
                else startBackup();
            }, 7000);
            // 2) 优先窗口到点：官方还没回来就并行放行备源（CORS 挂起/网络慢时不白等）
            setTimeout(startBackup, SEARCH_PRIORITY_WAIT);
            // 3) 全部失败兜底：9 秒后无结果则返回空（避免无限等待）
            setTimeout(function(){ finish([]); }, 9000);
        }
        function searchSongs(){
            var kw = $('playlistId').value.trim();
            if(!kw){ showStatus('请输入歌名或歌手关键词'); return; }
            hideError();
            hideKb();
            // 纯数字或含 id= 的输入 → 按 ID 加载（歌曲链接走单曲，其余走歌单/榜单）
            if(/^\d+$/.test(kw) || /id=\d+/.test(kw)){
                if(loadByIdInput(kw)) return;
            }
            var my = ++searchSeq;
            showStatus('正在搜索：“'+kw+'” …… 请稍候');
            searchMulti(kw, function(list){
                if(my !== searchSeq) return;
                // v1.15：showError 已复用同一个弹窗，不能再调 showStatus('') 把它清掉
                if(!list || !list.length){ showError('搜索接口暂时繁忙，请稍后重试（或使用歌单/排行榜）'); return; }
                loadDirect(list);
            });
        }

        function changeLyric(){
            var s = songList[curIndex];
            if(!s) return;
            var targetIdx = curIndex;   // 锁定目标歌：搜索候选期间若用户切换了歌曲，curIndex 会变，必须锁定原歌，否则记忆 key 会写错
            var kw = (s.name || '').trim();
            var artist = (s.artist || '').trim();
            if(!kw){ showStatus('无法获取歌曲信息'); return; }
            var baseName = kw.toLowerCase();
            var baseArtist = artist.toLowerCase();
            // 歌名 + 歌手 同时匹配：搜索词用「歌名 歌手」更精准，候选再按歌名和歌手双重筛选
            var searchKw = kw + (artist ? ' ' + artist : '');
            showStatus('正在搜索可用歌词...');
            searchMulti(searchKw, function(list){
                if(!list || !list.length){ showStatus('未找到候选歌词，可试手动输入ID'); return; }
                var candidates = [];
                for(var i=0; i<list.length && candidates.length<10; i++){
                    var r = list[i];
                    var nm = r.name || r.title || '';
                    var ar = r.artist || r.author || '';
                    var songId = r.id || '';
                    if(!songId) continue;
                    // 歌名归一化（去掉 "(Live)" 等括号后缀）后比较；必须匹配当前歌名
                    var nmBase = nm.toLowerCase().replace(/[（(].*?[)）]/g, '').trim();
                    if(nmBase.indexOf(baseName) < 0 && baseName.indexOf(nmBase) < 0) continue;
                    // 歌手必须匹配：当前歌手按 "/" 拆分成多名（如 黄绮珊/韩红），候选歌手含任意一名即保留（兼容合唱与单版）
                    if(baseArtist){
                        var parts = baseArtist.split('/').map(function(x){ return x.trim(); }).filter(Boolean);
                        var arL = ar.toLowerCase();
                        var matchedArtist = false;
                        for(var p=0; p<parts.length; p++){
                            if(parts[p] && arL.indexOf(parts[p].toLowerCase()) >= 0){ matchedArtist = true; break; }
                        }
                        if(!matchedArtist) continue;
                    }
                    candidates.push({ name: nm, artist: ar, songId: songId });
                }
                if(!candidates.length){ showStatus('未找到可用歌词源，可试手动输入ID'); return; }
                // 必须把锁定 targetIdx 传下去：搜索耗时数秒，期间用户切歌后 curIndex 已变，
                // 旧版漏传导致新歌词与记忆 key 被写到刚切换的歌上（换错歌）
                showLyricPicker(candidates, targetIdx);
            });
        }

        function showLyricPicker(candidates, targetIdx){
            var list = $('pickerList');
            $('pickerBody').style.display = 'none';   // 复位：上一轮可能是"输入ID"模式
            list.style.display = '';
            var html = '';
            for(var i=0;i<candidates.length;i++){
                html += '<div class="picker-item" tabindex="0" data-idx="'+i+'">'+
                        '<div class="pn"><span class="pno"></span><span class="pt"></span></div>'+
                        '<div class="pa"></div></div>';
            }
            list.innerHTML = html;
            var items = list.querySelectorAll('.picker-item');
            for(var k=0;k<items.length;k++){
                (function(el, i){
                    el.querySelector('.pno').textContent = (i+1) + '.';   // 标题前数字序号
                    el.querySelector('.pt').textContent = candidates[i].name;
                    el.querySelector('.pa').textContent = candidates[i].artist;
                    el.onclick = function(){ applyLyricById(candidates[i].songId, candidates[i].name, candidates[i].artist, targetIdx); };
                    el.onkeydown = function(ev){
                        if(ev.key==='Enter' || ev.keyCode===13){
                            if(ev.preventDefault) ev.preventDefault();
                            if(ev.stopPropagation) ev.stopPropagation();
                            applyLyricById(candidates[i].songId, candidates[i].name, candidates[i].artist, targetIdx);
                        }
                    };
                })(items[k], k);
            }
            hideKb();   // 弹窗打开时收起键盘，避免键盘盖住候选列表
            pickerAnchor = focusEl;
            pickerAnchorKey = focusKey;   // 稳定键：弹窗打开前的控件若被重建，也能按它找回来
            $('pickerMask').className = 'picker-mask show';
            $('pickerHeadTitle').textContent = '选择正确的歌词版本';
            $('pickerFoot').style.display = '';
            notifyPicker(true);
            remoteReset();
            var first = remoteCollect();
            if(first.length) remoteFocus(first[0].el);
        }

        function closePicker(){
            $('pickerMask').className = 'picker-mask';
            $('pickerFoot').style.display = '';
            // 复位"选择列表 / 输入ID"两种模式，否则下次打开会残留上一次的形态
            $('pickerBody').style.display = 'none';
            $('pickerList').style.display = '';
            $('btnManualLrc').style.display = '';
            $('btnSubmitLrc').style.display = 'none';
            hideKb();
            notifyPicker(false);
            var anchor = pickerAnchor;
            var anchorKey = pickerAnchorKey;
            pickerAnchor = null;
            pickerAnchorKey = '';
            remoteReset();
            // 关闭弹窗后把焦点还给打开弹窗前的控件，避免回退到页面第一项；
            // 该控件已被重建（DOM 引用失效）时按稳定键找回，不让焦点留空
            // 同步恢复：此时 DOM 已稳定，不需要延时；延时反而会在焦点空窗期吞掉一次按键
            if(anchor && document.body.contains(anchor) && remoteVisible(anchor)){
                remoteFocus(anchor);
            } else {
                restoreFocus(anchorKey || focusKey);
            }
        }

        function showBoardPicker(){
            var sel = $('boardSel');
            var opts = [];
            for(var i=0;i<sel.options.length;i++){ if(sel.options[i].value) opts.push(sel.options[i]); }
            if(!opts.length) return;
            var list = $('pickerList');
            $('pickerBody').style.display = 'none';   // 复位：上一轮可能是"输入ID"模式
            list.style.display = '';
            var html = '';
            for(var k=0;k<opts.length;k++){
                html += '<div class="picker-item" tabindex="0"><div class="pn"></div><div class="pa"></div></div>';
            }
            list.innerHTML = html;
            var items = list.querySelectorAll('.picker-item');
            for(var k=0;k<items.length;k++){
                (function(el, o){
                    el.querySelector('.pn').textContent = o.textContent;
                    // v1.7.8：已选中的那一行明确标出来（焦点框之外再加文字提示）
                    el.querySelector('.pa').textContent = (o.value === sel.value) ? '✓ 当前选中' : '点击加载该排行榜';
                    el.onclick = function(){
                        closePicker();
                        sel.value = o.value;
                        loadBoard();
                    };
                })(items[k], opts[k]);
            }
            $('pickerHeadTitle').textContent = '选择排行榜';
            $('pickerFoot').style.display = 'none';
            hideKb();   // 弹窗打开时收起键盘，避免键盘盖住候选列表
            pickerAnchor = focusEl;
            pickerAnchorKey = focusKey;   // 稳定键：弹窗打开前的控件若被重建，也能按它找回来
            $('pickerMask').className = 'picker-mask show';
            notifyPicker(true);
            remoteReset();
            // v1.7.8：打开时焦点直接落在"当前已选中的排行榜"那一行，而不是永远的第一行。
            // 真机反馈：上下键能移动，但每次打开都从第一行开始，焦点停不到已选中项上。
            var selIdx = 0;
            for(var s=0;s<opts.length;s++){ if(opts[s].value === sel.value){ selIdx = s; break; } }
            var collected = remoteCollect();
            if(collected.length) remoteFocus(items[selIdx] || collected[0].el);
        }

        function applyLyricById(songId, name, artist, targetIdx){
            if(!songId) return;
            closePicker();
            // 用锁定/传入的目标歌索引；缺省回退到当前播放歌（手动输入ID路径）
            var idx = (typeof targetIdx === 'number' && songList[targetIdx]) ? targetIdx : curIndex;
            if(!songList[idx]) return;
            var target = songList[idx];
            // 记忆 key 用「歌名|歌手|原始ID」：同名同歌手有多个版本（如刘欢《少年壮志不言愁》原版/Live版），
            // 必须按原始网易云 id 精准区分，避免所有同名版本共享同一份记忆导致某些版本歌词不适配
            var origKey = (target.name || '') + '|' + (target.artist || '') + '|' + (target._origId || target.id || '');
            target.id = songId;   // 只换歌词 id；播放地址仍按 urlId/_origId 走，不动当前音频
            // 换词结果自动记忆：key 用「歌名|歌手|原始ID」（同名同歌手多版本按原始网易云 id 精准区分），下次播放同曲自动应用
            if(origKey){
                lyricMemory[origKey] = { id: songId, name: name || '', artist: artist || '' };
                saveLyricMemory();
            }
            var k = offsetKey(target);
            if(songOffsets[k] !== undefined){ delete songOffsets[k]; saveOffsets(); }
            // 换词前立即清空旧歌词，避免新歌词异步加载期间残留上一版歌词
            showStatus('正在加载歌词...');
            lrcLines = [];
            lrcEls = [];          // 行数相同的两个版本也必须重建 DOM，否则仍显示旧文本
            refreshOffsetDisplay();
            updateLrc(0);
            var ltk = playToken;
            fetchLrcChain(songId, ltk, function(l){
                if(ltk !== playToken) return;
                lrcLines = l;
                refreshOffsetDisplay();
                updateLrc(audio.currentTime);
                checkedLrcSync = false;   // 换的是新歌词版本，需重新做"试听版不同步"校验
                checkLrcSync();
                if(l.length){
                    showStatus('歌词已更换为：' + name + (artist ? ' - '+artist : ''), true);
                } else {
                    showStatus('该版本无歌词，可换一个或手动输入ID', true);
                }
            });
        }

        function downloadCurrent(){
            var s = songList[curIndex];
            if(!s) return;
            var u = audio.src;
            // 只放行 http(s)：audio.src 的值来自第三方接口返回的 JSON（gdstudio / Meting），
            // 直接交给原生 DownloadManager 之前必须卡协议，否则 file:// / content:// 之类会被原样接受。
            // （旧写法里的 u.indexOf('blob:')===0 是死条件：能进到这一行就说明已经以 http 开头了。）
            if(!/^https?:\/\//i.test(u || '')){
                showStatus('请先播放歌曲后再下载'); return;
            }
            var base = (s.name || '歌曲').replace(/[\\/:*?"<>|]/g, '_');
            var ar = (s.artist || '').replace(/[\\/:*?"<>|]/g, '_');
            var fname = (base + (ar ? ' - ' + ar : '')) + '.mp3';
            showStatus('正在下载：' + base + (ar ? ' - ' + ar : '') + ' ...', true);
            // Android 外壳提供原生下载桥接：直接交给系统 DownloadManager 保存到「下载」目录
            if (window.Yanzi && typeof window.Yanzi.downloadFile === 'function') {
                try { window.Yanzi.downloadFile(u, fname); return; } catch(e){ showStatus('原生下载调用失败，尝试浏览器方式', true); }
            }
            // 浏览器回退：优先 fetch blob 真正保存文件；网易云 CDN 无 CORS 时会失败，退回新标签打开（可手动另存）
            fetch(u, { mode: 'cors' }).then(function(r){
                if(!r.ok) throw new Error('http ' + r.status);
                return r.blob();
            }).then(function(b){
                var blobUrl = URL.createObjectURL(b);
                var a = document.createElement('a');
                a.href = blobUrl;
                a.download = fname;
                document.body.appendChild(a);
                a.click();
                setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(blobUrl); }, 200);
                showStatus('已下载：' + base + (ar ? ' - ' + ar : '') + '（VIP/付费歌为30秒试听版）', true);
            }).catch(function(){
                // 不再用 a.target='_blank' 兜底：WebView 未开启多窗口时，这个动作要么什么都不发生，
                // 要么把当前页面导航走 —— 后者会直接毁掉正在播放的会话。
                // 改为"给出可复制的直链"，让用户自己决定怎么处理。
                copyText(u);
                showStatus('该音频不允许直接保存，已复制音频直链（可粘贴到浏览器下载）：' + base, true);
            });
        }

        /** 复制到剪贴板：优先异步 API，失败退回 textarea + execCommand（老 WebView 只有后者） */
        function copyText(txt){
            try{
                if(navigator.clipboard && navigator.clipboard.writeText){
                    navigator.clipboard.writeText(txt).catch(function(){ legacyCopy(txt); });
                    return;
                }
            }catch(e){}
            legacyCopy(txt);
        }
        function legacyCopy(txt){
            try{
                var ta = document.createElement('textarea');
                ta.value = txt;
                ta.setAttribute('readonly', 'readonly');
                ta.style.position = 'fixed';
                ta.style.top = '-1000px';
                document.body.appendChild(ta);
                ta.select();
                ta.setSelectionRange(0, txt.length);
                document.execCommand('copy');
                document.body.removeChild(ta);
            }catch(e){}
        }

        /* 手动输入歌曲ID：改用弹层里的输入框，不再用 prompt()。
           prompt() 需要宿主实现 WebChromeClient.onJsPrompt()，没实现的壳里直接返回 null —— 功能静默失效；
           电视上更不可能有原生输入框。这里复用现成的 picker 弹层与焦点系统。 */
        function manualLyricById(){
            var s = songList[curIndex];
            var list = $('pickerList');
            list.innerHTML = '';
            list.style.display = 'none';
            $('pickerBody').style.display = '';
            $('pickerHeadTitle').textContent = '输入正确的网易云歌曲ID';
            $('pickerFoot').style.display = '';
            // 这个模式下"手动输入歌曲ID"没意义（已经在输入了），换成"确定"
            $('btnManualLrc').style.display = 'none';
            $('btnSubmitLrc').style.display = '';
            var inp = $('lrcIdInput');
            inp.value = s ? (s._origId || s.id || '') : '';
            pickerAnchor = focusEl;
            pickerAnchorKey = focusKey;
            $('pickerMask').className = 'picker-mask show';
            notifyPicker(true);
            remoteReset();
            if(isTv){
                // 电视：焦点给输入框但不做真实 focus（避免遥控器一进来就弹键盘），确认键再弹
                var items = remoteCollect();
                var target = null;
                for(var i = 0; i < items.length; i++){ if(items[i].el === inp){ target = items[i].el; break; } }
                remoteFocus(target || (items.length ? items[0].el : null));
            } else {
                try{ inp.focus(); kbSession = true; showKb(); }catch(e){}
            }
        }

        /** 提交弹层里的歌曲ID（回车 / 确认键 / 点"确定"） */
        function submitLyricId(){
            var inp = $('lrcIdInput');
            var raw = (inp.value || '').trim();
            var m = raw.match(/id=(\d+)/);
            var id = m ? m[1] : raw;
            if(!/^\d+$/.test(id)){ showStatus('ID格式不正确，应为纯数字（或粘贴含 id= 的链接）'); return; }
            var s = songList[curIndex];
            hideKb();
            applyLyricById(id, s ? (s.name || '') : '', s ? (s.artist || '') : '');
        }

        /** 按输入内容分流：歌曲链接 → 单曲；歌单链接/排行榜/裸数字 → 歌单（裸数字大概率是歌单ID，保持原来的快路径） */
        function loadByIdInput(raw){
            var pid = parsePlaylistId(raw);
            if(!pid) return false;
            if(/\/song|song\?id=|song%3Fid%3D/i.test(raw)){
                loadSongById(pid, function(){ loadPlaylist(); });
            } else {
                showStatus('按ID加载：' + pid + ' ...');
                loadPlaylist();
            }
            return true;
        }

        function loadOrSearch(){
            var v = $('playlistId').value.trim();
            if(!v){ showStatus('请输入歌单ID/链接，或歌名/歌手关键词'); return; }
            hideKb();   // 搜索动作一旦发起就收起键盘，避免键盘遮挡歌单、焦点环错位
            if(loadByIdInput(v)) return;
            searchSongs();
        }

        function loadStartSong(){
            // 启动直接播放排行榜「热歌榜」(3778678)：下拉框与输入框同步选中，
            // 复用歌单加载链（loadPlaylist → loadDirect 会自动播放第一首）。
            var HOT_BOARD_ID = '3778678';
            $('playlistId').value = HOT_BOARD_ID;
            if($('boardSel')) $('boardSel').value = HOT_BOARD_ID;
            loadPlaylist();
            // 兜底：两个歌单源都超时/失败时，用默认单曲保证启动有声。
            // 7s 是避开 getText 的 6s 超时；期间用户已自行加载出列表就不再插手。
            setTimeout(function(){
                if(songList.length || !DEFAULT_START || !DEFAULT_START.id) return;
                hideError();
                var d = DEFAULT_START;
                loadDirect([{ name: d.name, artist: d.artist || '',
                              id: d.id, urlId: d.id, url: SRC.qj.url(d.id),
                              pic: d.pic || '', picId: extractPicId(d.pic) }]);
            }, 7000);
        }

        function loadBoard(){
            var id = $('boardSel').value;
            if(!id){ showStatus('请先选择一个排行榜'); return; }
            $('playlistId').value = id;
            loadPlaylist();
        }

        /* ===== 电视 / 遥控器焦点系统：原生层接管方向键与确认键，页面按分组维护焦点；
                 歌词显示区与歌词工具栏对遥控器完全禁焦。手机触屏逻辑不受影响 ===== */
        var isTv = false;
        var focusEl = null;
        var pickerAnchor = null;
        /* v1.7.6：焦点的稳定标识。此前只记 focusEl 这个 DOM 引用，列表/歌词一旦重建
           引用即成悬空，所有方向键移动都会退化成"跳到第一个元素"（真机表现：焦点弹回搜索框）。
           focusKey 用可跨重建对应的选择器字符串表示，重建后能精确找回同一个控件。 */
        var focusKey = '';
        var pickerAnchorKey = '';

        function remoteVisible(el){ return !!el && el.offsetParent !== null; }

        function elIndexIn(el, sel){
            var n = document.querySelectorAll(sel);
            for(var i=0;i<n.length;i++){ if(n[i] === el) return i; }
            return 0;
        }

        // DOM 元素 → 稳定键：'#playlistId' / 'li:3' / 'pbtn:2' / 'lrc:1' / 'chg' / 'pk:0'
        function focusKeyOf(el){
            if(!el || !el.tagName) return '';
            if(el.id) return '#' + el.id;
            var c = el.classList;
            if(!c) return '';
            if(c.contains('li')) return 'li:' + (el.getAttribute('data-idx') || '');
            if(c.contains('picker-item')) return 'pk:' + elIndexIn(el, '.picker-item');
            if(c.contains('p-btn')) return 'pbtn:' + elIndexIn(el, '.p-btn');
            if(c.contains('lrc-btn')) return 'lrc:' + elIndexIn(el, '.lrc-btn');
            if(c.contains('change-btn')) return 'chg';
            return '';
        }

        // 稳定键 → 当前 DOM 元素（列表行按 data-idx 精确对应，不依赖节点顺序）
        function findByFocusKey(key){
            if(!key) return null;
            if(key.charAt(0) === '#') return document.getElementById(key.slice(1));
            // v1.7.8：'chg' 是不带冒号的键（搜歌按钮），旧实现只走 indexOf(':') 分支，
            // 解析必失败 → restoreFocus 退到搜索框。真机表现：按下搜歌、列表重建后
            // 焦点自己跳回搜索框（按 OK 功能是好的，只是焦点位置被打断）。
            if(key === 'chg') return document.querySelector('.change-btn');
            var i = key.indexOf(':');
            if(i < 0) return null;
            var p = key.slice(0, i), v = key.slice(i + 1);
            var sel = p === 'li' ? '.p-list .li'
                    : p === 'pk' ? '.picker-item'
                    : p === 'pbtn' ? '.p-btn'
                    : p === 'lrc' ? '.lrc-btn'
                    : p === 'chg' ? '.change-btn' : '';
            if(!sel) return null;
            var n = document.querySelectorAll(sel);
            if(!n.length) return null;
            if(p === 'li'){
                for(var k=0;k<n.length;k++){ if(n[k].getAttribute('data-idx') === v) return n[k]; }
                return n[0];   // 换列表后行数变少：回到首行，而不是把焦点丢掉
            }
            var idx = parseInt(v, 10) || 0;
            if(idx >= n.length) idx = n.length - 1;
            return n[idx];
        }

        /** 按稳定键恢复焦点；找不到就回到搜索框，保证任何时刻都有一个可见焦点。 */
        function restoreFocus(key){
            if(!isTv) return;
            var el = findByFocusKey(key);
            if(el && remoteVisible(el)){ remoteFocus(el); return; }
            var fb = $('playlistId');
            if(fb && remoteVisible(fb)) remoteFocus(fb);
        }

        // 仅把歌词滚动显示文本区置为不可聚焦；歌词工具栏按钮（−/＋/换词/下载）保留遥控器可达
        function disableLyricFocus(){
            var nodes = document.querySelectorAll('.p-lrc, .p-lrc *');
            for(var i=0;i<nodes.length;i++){
                nodes[i].setAttribute('tabindex', '-1');
                try{ nodes[i].style.outline = 'none'; }catch(e){}
            }
        }

        function remoteCollect(){
            if($('pickerMask').classList.contains('show')){
                var p = [];
                // "输入歌曲ID"模式：输入框也要进焦点组，否则遥控器根本选不到它
                if($('pickerBody') && $('pickerBody').style.display !== 'none'){
                    var ib = $('lrcIdInput');
                    if(ib && remoteVisible(ib)) p.push({el: ib, group:'picker'});
                }
                var pl = $('pickerList').querySelectorAll('.picker-item');
                for(var i=0;i<pl.length;i++){ if(remoteVisible(pl[i])) p.push({el:pl[i], group:'picker'}); }
                var pb = document.querySelectorAll('.picker-foot button');
                for(var j=0;j<pb.length;j++){ if(remoteVisible(pb[j])) p.push({el:pb[j], group:'picker'}); }
                return p;
            }
            // 按屏幕物理顺序纵向分组：搜索行 → 歌词工具栏 → 进度条 → 播放控制行 → 歌曲列表；歌词文本区不进入焦点
            var groups = [
                { group:'search',    sels:['#playlistId', '.change-btn', '#boardSel'] },
                { group:'lyricbar',  sels:['.lrc-btn'] },
                { group:'bar',       sels:['#bar'] },
                { group:'transport', sels:['.p-btn'] },
                { group:'list',      sels:['.p-list .li'] }
            ];
            var list = [];
            for(var a=0;a<groups.length;a++){
                for(var b=0;b<groups[a].sels.length;b++){
                    var n = document.querySelectorAll(groups[a].sels[b]);
                    for(var m=0;m<n.length;m++){ if(remoteVisible(n[m])) list.push({el:n[m], group:groups[a].group}); }
                }
            }
            return list;
        }

        function remoteEntryIndex(list, el){
            for(var i=0;i<list.length;i++){ if(list[i].el === el) return i; }
            return -1;
        }

        function remoteGroupIndices(list, group){
            var idx = [];
            for(var i=0;i<list.length;i++){ if(list[i].group === group) idx.push(i); }
            return idx;
        }

        function remoteEnterGroup(list, groupName, dir){
            var idxs = remoteGroupIndices(list, groupName);
            if(!idxs.length) return false;
            remoteFocus(list[dir > 0 ? idxs[0] : idxs[idxs.length-1]].el);
            return true;
        }

        function remoteClear(){
            // 清全部：只清第一个会在异步恢复（setTimeout / layoutTvList 回调）竞争时
            // 留下第二个框，真机上表现为"两个控件同时被框住"
            var olds = document.querySelectorAll('.tv-focus');
            for(var i=0;i<olds.length;i++){ olds[i].classList.remove('tv-focus'); }
            // 同时移除真实 DOM 焦点：旧控件若被真实 focus 过（remoteFocus 对按钮/列表行会做
            // el.focus()），只摘类不足以清掉它持有的焦点，WebView 会在旧控件上继续画焦点环
            var ae = document.activeElement;
            if(ae && ae !== document.body && ae.blur){
                /* 键盘会话中（焦点在输入框）绝不摘掉输入框的真实焦点：
                   列表重建 / 焦点环移动时若 blur 输入框，InputConnection 会一起被掐断、
                   IME 随即被系统收起。会话结束（hideKb / __kbClosed）后则必须摘掉，
                   否则输入框一直持有 DOM 焦点，页面按键判断会永远认为"还在输入"。 */
                var isInput = ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA';
                if(!isInput || !kbSession){ try{ ae.blur(); }catch(e){} }
            }
        }

        function remoteReset(){
            remoteClear();
            focusEl = null;
            var ae = document.activeElement;
            if(ae && ae !== document.body && ae.blur){ try{ ae.blur(); }catch(e){} }
        }

        // 只查找歌单列表或选项弹窗自身的滚动容器；进度条、播放按钮、歌词工具栏等不触发任何页面滚动
        function nearestScrollBox(el){
            var selectors = ['.p-list', '.picker-list'];
            for(var c=0; c<selectors.length; c++){
                var box = null;
                if(el.closest){ box = el.closest(selectors[c]); }
                if(!box){
                    var parent = el.parentElement;
                    while(parent){
                        var cls = parent.classList ? parent.classList : [];
                        if(cls.contains(selectors[c].slice(1))){ box = parent; break; }
                        parent = parent.parentElement;
                    }
                }
                if(box) return box;
            }
            return null;
        }

        function focusScroll(el){
            var box = nearestScrollBox(el);
            if(!box) return;
            var er = el.getBoundingClientRect();
            var br = box.getBoundingClientRect();
            if(er.height <= 0 || br.height <= 0) return;
            var margin = 16;
            if(er.top < br.top){
                box.scrollTop = Math.max(0, box.scrollTop - (br.top - er.top + margin));
            } else if(er.bottom > br.bottom){
                box.scrollTop = box.scrollTop + (er.bottom - br.bottom + margin);
            }
        }

        function remoteFocus(el){
            remoteClear();
            if(!el) return;
            focusEl = el;
            focusKey = focusKeyOf(el);   // 记住稳定键：DOM 重建后仍能找回同一控件
            el.classList.add('tv-focus');
            // 输入框 / 下拉框只给视觉焦点环，不做真实 DOM focus：
            // 一旦真实聚焦，focus 事件与 WebView 的 InputConnection 会各自唤起一次输入法，
            // 电视上"遥控器只是移动焦点经过搜索框"就会莫名弹出键盘。
            var tag = el.tagName;
            if(tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA'){
                try{ el.focus({preventScroll:true}); }catch(e){ try{ el.focus(); }catch(e2){} }
            }
            // 输入框只给视觉焦点环、不做真实 DOM focus（见上注释）。输入中列表重建时
            // 焦点由 remoteClear 的"不摘输入框焦点"保护；万一仍丢失，原生层 isActive
            // 轮询会发现连接断开并回调 __kbClosed 自愈，页面无需在此补救。
            // 电视上遥控器移动到播放列表行时，该焦点行始终置顶
            try{
                if(el.classList.contains('li') && $('listBox') && $('listBox').contains(el)){
                    scrollListRowToTop(el);
                } else {
                    focusScroll(el);
                }
            }catch(e){}
        }

        /** 当前焦点在列表里的下标。DOM 引用失效（列表重建过）时按稳定键重新定位。 */
        function currentEntry(list){
            var cur = remoteEntryIndex(list, focusEl);
            if(cur < 0 && focusKey){
                var el = findByFocusKey(focusKey);
                if(el){
                    cur = remoteEntryIndex(list, el);
                    if(cur >= 0) focusEl = el;
                }
            }
            return cur;
        }

        function remoteMoveVertical(dir){
            if(!isTv) return;
            var list = remoteCollect();
            if(!list.length) return;
            var cur = currentEntry(list);
            if(cur < 0){
                remoteFocus(dir > 0 ? list[0].el : list[list.length-1].el);
                return;
            }
            var group = list[cur].group;
            // 选项弹窗：上下键在选项之间循环移动，首末项不跳过中间项
            if(group === 'picker'){
                var opts = remoteGroupIndices(list, 'picker');
                if(opts.length){
                    var pPos = opts.indexOf(cur);
                    if(pPos < 0) pPos = 0;
                    pPos += dir;
                    if(pPos < 0) pPos = opts.length - 1;
                    if(pPos >= opts.length) pPos = 0;
                    remoteFocus(list[opts[pPos]].el);
                }
                return;
            }
            // 歌单组：上下键逐行移动；首行继续向上则返回上方播放控制行，末行向下停在末行
            if(group === 'list'){
                var rows = remoteGroupIndices(list, 'list');
                if(rows.length){
                    var pos = rows.indexOf(cur);
                    if(pos < 0) pos = 0;
                    var nextPos = pos + dir;
                    if(nextPos < 0){
                        if(!remoteEnterGroup(list, 'transport', -1)){
                            remoteFocus(list[rows[0]].el);
                        }
                        return;
                    }
                    if(nextPos >= rows.length){
                        remoteFocus(list[rows[rows.length-1]].el);
                        return;
                    }
                    remoteFocus(list[rows[nextPos]].el);
                }
                return;
            }
            // 其余单行组：按屏幕顺序跨组移动
            var order = ['search','lyricbar','bar','transport','list','picker'];
            var gi = order.indexOf(group);
            var nextGi = gi + dir;
            while(nextGi >= 0 && nextGi < order.length){
                var idxs = remoteGroupIndices(list, order[nextGi]);
                if(idxs.length){
                    remoteFocus(list[dir > 0 ? idxs[0] : idxs[idxs.length-1]].el);
                    return;
                }
                nextGi += dir;
            }
            var same = remoteGroupIndices(list, group);
            if(same.length) remoteFocus(list[dir > 0 ? same[same.length-1] : same[0]].el);
        }

        function remoteMoveHorizontal(dir){
            if(!isTv) return;
            var list = remoteCollect();
            if(!list.length) return;
            var cur = currentEntry(list);
            if(cur < 0){ remoteFocus(list[dir > 0 ? 0 : list.length-1].el); return; }
            var group = list[cur].group;
            if(group === 'bar'){
                remoteSeek(dir > 0 ? audio.duration * 0.05 : -audio.duration * 0.05);
                return;
            }
            if(group === 'list'){ return; }
            var idxs = remoteGroupIndices(list, group);
            var pos = idxs.indexOf(cur);
            if(pos < 0) pos = 0;
            pos += dir;
            if(pos < 0) pos = idxs.length - 1;
            if(pos >= idxs.length) pos = 0;
            remoteFocus(list[idxs[pos]].el);
        }

        function remoteActivate(){
            if(!isTv) return;
            var list = remoteCollect();
            // 优先以当前可见的焦点环元素为准（DOM 引用可能已因列表重建失效，再按稳定键兜底一次），
            // 避免列表重建后按 OK 被误判成"当前什么都没有"，从而错触发第一个元素（搜索框弹键盘）
            var el = document.querySelector('.tv-focus');
            if(!el && focusEl && document.body.contains(focusEl)) el = focusEl;
            if(!el && focusKey) el = findByFocusKey(focusKey);
            var matched = false;
            for(var i=0;i<list.length;i++){ if(list[i].el === el){ matched = true; break; } }
            if(!matched && list.length) el = list[0].el;
            if(!el) return;
            focusEl = el;
            if(window.__diag) window.__diag('activate ' + (el.id || el.tagName) + ' matched=' + matched);
            // 输入框：确认键 = 打开页面自绘的电视键盘（完全不碰系统输入法）。
            // 手机端（isTv=false）这条路走不到——手机直接点输入框，由系统键盘输入。
            if(el.tagName === 'INPUT'){
                openTvKb(el, el.id === 'lrcIdInput' ? 'num' : 'abc');
                return;
            }
            if(el.classList.contains('change-btn')){
                try{
                    var kw = $('playlistId').value.trim();
                    showStatus(kw ? '正在检索：' + kw : '正在按当前内容检索...', true);
                    loadOrSearch();
                }catch(err){ showStatus('搜索失败：' + err.message, true); }
                return;
            }
            // 排行榜：确认键弹出榜单选项列表，遥控器上下选择后直接加载
            if(el.tagName === 'SELECT'){
                showBoardPicker();
                return;
            }
            if(el.id === 'bar'){ return; }
            // 列表行直接按 data-idx 调 pick，避免不同 WebView 对 div 合成 click 支持不一致
            if(el.classList && el.classList.contains('li')){
                var di = parseInt(el.getAttribute('data-idx'), 10);
                if(!isNaN(di) && typeof pick === 'function'){ pick(di); return; }
            }
            var anchor = el;
            try{ el.click(); }catch(e){
                try{ el.dispatchEvent(new MouseEvent('click', {bubbles:true, cancelable:true})); }catch(e2){}
            }
            // 播放/切歌/列表开关等动作会重建列表，结束后焦点仍停留在原控件，不跳到列表首行
            setTimeout(function(){
                if(document.body.contains(anchor) && remoteVisible(anchor)){
                    remoteFocus(anchor);
                }
            }, 120);
        }

        function remoteSeek(step){
            if(!isTv) return;
            if(!audio.duration) return;
            audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + step));
        }

        // 电视模式按真实视口分配卡片和歌单高度，避免旧 WebView 弹性布局不生效导致列表被压扁。
        // cb：布局真正生效后回调（焦点恢复必须在高度改完之后，否则滚动位置算错）
        function layoutTvList(cb){
            if(!isTv){ if(cb) cb(); return; }
            // adjustNothing 下键盘弹出不再压缩视口，无需任何键盘相关的布局保护
            var card = $('playerCard');
            var fixed = card ? card.querySelector('.p-fixed') : null;
            var list = $('listBox');
            if(!card || !fixed || !list){ if(cb) cb(); return; }
            // 列表折叠时不要按整屏分配固定高度：卡片应收缩到内容高度，
            // 否则电视上仍留一大块白底，展开时高度也会错位。
            if(listHidden){
                card.style.height = '';
                list.style.height = '';
                list.style.maxHeight = '';
                if(cb) cb();
                return;
            }
            function apply(){
                card.style.height = '';
                list.style.height = '';
                list.style.maxHeight = '';
                var cardTop = card.offsetTop || 0;
                // v1.15：底部提示已改为 fixed 浮层，不再占布局高度；body.tv 底部 padding 也归零。
                // 卡片高度直接铺到视口底边（只保留 1px 防滚动条舍入误差）。
                var cardH = window.innerHeight - cardTop - 1;
                var fixedH = fixed.offsetHeight || 0;
                if(cardH < fixedH + 120) cardH = fixedH + 120;
                var listH = cardH - fixedH;
                if(listH < 120) listH = 120;
                card.style.height = cardH + 'px';
                list.style.height = listH + 'px';
                list.style.maxHeight = listH + 'px';
                if(cb) cb();
            }
            // rAF 在页面不可见 / 盒子 WebView 渲染被暂停时不会触发，回调（含焦点恢复）就会
            // 永远不执行；这里用 setTimeout 兜底，保证布局与回调一定会跑到一次。
            var done = false;
            function run(){ if(done) return; done = true; apply(); }
            if(window.requestAnimationFrame){
                requestAnimationFrame(function(){ requestAnimationFrame(run); });
                setTimeout(run, 150);
            } else { run(); }
        }

        /* 原生层可能在 DOMContentLoaded 之前就下发模式/按键（冷启动抢跑），
           此时 document.body 还不存在，旧实现会直接在原生侧抛一次 TypeError 并丢掉这次调用。
           这里把模式先记下来，等 DOM 就绪后再补做。 */
        var pendingTv = null;
        window.__setTv = function(flag){
            isTv = !!flag;
            if(!document.body){ pendingTv = isTv; return; }
            document.body.classList.toggle('tv', isTv);
            if(isTv){
                // 电视模式下禁止整页纵向滚动；只允许歌单容器自身滚动
                document.documentElement.style.overflow = 'hidden';
                document.body.style.overflow = 'hidden';
                // 已有有效焦点就原样保留（重复下发 __setTv 时不能把用户焦点重置掉）；
                // 冷启动必须主动建立焦点：框线只由 .tv-focus 类绘制、没有 :focus 兜底，
                // 不主动设焦点的话启动时页面上一条框都没有。
                if(focusEl && document.body.contains(focusEl) && remoteVisible(focusEl)){
                    remoteFocus(focusEl);
                } else {
                    restoreFocus(focusKey || '#playlistId');
                }
                layoutTvList(function(){
                    if(isTv && focusEl && document.body.contains(focusEl)) focusScroll(focusEl);
                });
            } else {
                document.documentElement.style.overflow = '';
                document.body.style.overflow = '';
                var card = $('playerCard'), list = $('listBox');
                if(card) card.style.height = '';
                if(list){ list.style.height = ''; list.style.maxHeight = ''; }
                remoteReset();
            }
        };

        /* 冷启动抢跑：原生层可能在 DOM 就绪前就转发遥控器按键（dispatchKeyEvent 不等人）。
           旧实现直接丢弃，用户开机后第一次按键无任何反馈。这里记下最后一条命令，
           DOMContentLoaded 后补放一次（连续按键只保留最后一条足够，方向键幂等）。 */
        var pendingRemote = null;
        window.__remote = function(cmd){
            // DOM 未就绪时不要进来：remoteCollect() 里 $('pickerMask').classList 会直接抛异常
            if(!isTv || !document.body || !$('pickerMask')){
                if(window.__diag) window.__diag('remote ' + cmd + ' pending isTv=' + isTv);
                pendingRemote = cmd;
                return;
            }
            if(window.__diag && cmd === 'ok') window.__diag('remote ok');
            // 自绘键盘打开时，遥控器按键全部交给键盘自己的二维网格导航（页面焦点不参与）
            if(tvkb){
                if(cmd === 'up'){ tvkbMove(0, -1); }
                else if(cmd === 'down'){ tvkbMove(0, 1); }
                else if(cmd === 'left'){ tvkbMove(-1, 0); }
                else if(cmd === 'right'){ tvkbMove(1, 0); }
                else if(cmd === 'ok'){ tvkbOk(); }
                else if(cmd === 'back'){ tvkbClose(); }
                return;
            }
            // 无需判断键盘状态：键盘会话期间原生层已把方向键/确认键放行给系统输入法，
            // 根本不会产生 __remote 调用。
            if(cmd === 'up'){ remoteMoveVertical(-1); }
            else if(cmd === 'down'){ remoteMoveVertical(1); }
            else if(cmd === 'left'){ remoteMoveHorizontal(-1); }
            else if(cmd === 'right'){ remoteMoveHorizontal(1); }
            else if(cmd === 'ok'){ remoteActivate(); }
        };

        function initTvRemote(){
            var ua = navigator.userAgent || '';
            // 只在明确的电视/盒子特征下自动进入电视模式。
            // 注意：不能用裸 "Xiaomi" / "AOSP" 匹配 —— 小米手机和部分原生 ROM 手机的 UA 同样命中，
            // 会把手机误判成电视并锁进单屏布局（v1.6 的线上问题）。
            // 也不要再用"无触摸 + 宽视口"这条启发式：桌面 Chrome / 无触摸笔记本的
            // 'ontouchstart' 本来就是 false，1280 宽的窗口必然命中，于是普通电脑打开本页
            // 会被锁成 single-screen（documentElement.overflow=hidden，整页不能滚）。
            // 盒子若 UA 不带电视特征，由原生层主动调 __setTv(true)；调试时用 ?tv=1 / ?tv=0 强制开关。
            var tvUa = /Android TV|Smart-?TV|Google ?TV|Mi ?Box|MiTV|Fire TV|Web0S|Tizen|BRAVIA|Hisense|Skyworth|Set-top|\bSTB\b/i;
            var q = location.search || '';
            var tvOff = /[?&]tv=0\b/.test(q);
            var tvForce = /[?&]tv=1\b/.test(q);
            if(!tvOff && (tvForce || tvUa.test(ua))){
                window.__setTv(true);
            }
            disableLyricFocus();
            // resize 没有节流：拖窗口时每帧都会重排一次卡片/列表高度，加上里面的双 rAF + 150ms 兜底，
            // 一次拖动会堆出上百个回调。这里做 120ms 合并。
            var resizeTimer = null;
            window.addEventListener('resize', function(){
                if(!isTv) return;
                // adjustNothing 下键盘弹出不再触发视口变化，这里只需处理真实窗口变化
                if(resizeTimer) clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function(){
                    resizeTimer = null;
                    if(!isTv) return;
                    layoutTvList();
                }, 120);
            });
            document.addEventListener('keydown', function(ev){
                if(!isTv) return;
                // 输入中（焦点在输入框）：方向键和回车一律交给系统输入法选词/上字，
                // 页面不抢焦点、不抢确认键。
                var ae = document.activeElement;
                if(ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
                var k = ev.key;
                if(k === 'ArrowDown'){ ev.preventDefault(); window.__remote('down'); }
                else if(k === 'ArrowUp'){ ev.preventDefault(); window.__remote('up'); }
                else if(k === 'ArrowRight'){ ev.preventDefault(); window.__remote('right'); }
                else if(k === 'ArrowLeft'){ ev.preventDefault(); window.__remote('left'); }
                else if(k === 'Enter' || k === ' '){
                    // 焦点在输入框、或事件本身就来自输入框（此时可能已 blur）时都不抢：
                    // 输入框里的回车属于"提交搜索"，由 onSearchKey 处理
                    var tg = ev.target;
                    if(tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT')) return;
                    if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
                    ev.preventDefault(); window.__remote('ok');
                }
                else if(k === 'Escape'){
                    // 统一走"连按两次退出"状态机（内部含关弹窗 / 收键盘 / 双击确认）
                    if(handleBack() && ev.preventDefault) ev.preventDefault();
                }
            }, false);
        }

        /* ===== 事件绑定（替代内联 onclick / onkeydown） =====
           内联事件处理器无法被 CSP 有效防护（必须放开 script-src 'unsafe-inline'），
           而且"页面到底有哪些动作"只能翻 HTML 才知道。统一收到这里：
           新增按钮只要写 data-action，一处就能看到全部动作。
           注意：列表行、候选行的 onclick 是按索引闭包绑定的，仍然就近写在渲染函数里。 */
        function bindUi(){
            var ACTIONS = {
                'prev':        function(){ playPrev(); },
                'toggle':      function(){ togglePlay(); },
                'next':        function(){ playNext(); },
                'mute':        function(){ toggleVol(); },
                'mode':        function(){ toggleMode(); },
                'list':        function(){ listToggle(); },
                'offset-back': function(){ adjustOffset(-0.1); },   // "−" 按钮 = 歌词延后
                'offset-fwd':  function(){ adjustOffset(0.1); },    // "+" 按钮 = 歌词提前
                'change-lrc':  function(){ changeLyric(); },
                'download':    function(){ downloadCurrent(); },
                'close-picker': function(){ closePicker(); },
                'manual-lrc':  function(){ manualLyricById(); },
                'submit-lrc':  function(){ submitLyricId(); }
            };
            function actionOf(el){
                while(el && el !== document.body){
                    if(el.getAttribute && el.getAttribute('data-action')) return el;
                    el = el.parentElement;
                }
                return null;
            }
            document.addEventListener('click', function(e){
                var el = actionOf(e.target);
                if(!el) return;
                var fn = ACTIONS[el.getAttribute('data-action')];
                if(fn) fn();
            }, false);

            // 搜索框：回车/输入法搜索键 → 检索（原来写在内联属性里）
            var kwBox = $('playlistId');
            if(kwBox){
                kwBox.addEventListener('keydown', function(ev){ onSearchKey(ev); }, false);
                kwBox.addEventListener('search', function(){ doSearchFromIme(); }, false);
            }
            if($('searchBtn')) $('searchBtn').addEventListener('click', function(){ loadOrSearch(); }, false);
            if($('boardSel')) $('boardSel').addEventListener('change', function(){ loadBoard(); }, false);

            // 弹层里的歌曲ID输入框：回车直接提交
            if($('lrcIdInput')){
                $('lrcIdInput').addEventListener('keydown', function(ev){
                    var isEnter = ev.key === 'Enter' || ev.keyCode === 13;
                    if(!isEnter) return;
                    if(ev.isComposing) return;                 // 组词中的回车交给输入法
                    if(ev.preventDefault) ev.preventDefault();
                    if(ev.stopPropagation) ev.stopPropagation();
                    submitLyricId();
                }, false);
            }
        }

        document.addEventListener('DOMContentLoaded', function(){
            loadOffsets();
            loadLyricMemory();
            loadSrcStat();
            bindUi();
            if(pendingTv !== null){ window.__setTv(pendingTv); pendingTv = null; }   // 补做抢跑期间的 __setTv
            setModeIcon(0);
            $('modeBtn').title = modeLabels[0];
            setMuteIcon(false);
            refreshOffsetDisplay();
            reportPlaybackState();
            initTvRemote();
            armBackGuard();       // 纯网页端的"连按两次返回"；APP 内由原生层调 window.__onBack()
            /* v1.21 手机输入法唤起：必须在「用户手势的同步调用栈」里显式 input.focus()，
               否则 WebView 不建立 InputConnection、不向 IME 请求软键盘（旧实现只在 focus
               事件里被动调原生桥、从不主动 focus，是「点搜索框没反应」的根因）。
               一次手势（pointerdown → touchend → click → focus 事件）只建立一次焦点、
               只发一次请求；补发由 showKb 内部唯一的看门狗负责（只补发请求，不重复 focus）。
               电视模式整条链路不启用：遥控器走 remoteActivate() 的确认键分支。 */
            var kwBox = $('playlistId');
            if(kwBox){
                function wakeInput(){
                    if(isTv) return;
                    userActed = true;
                    var now = Date.now();
                    if(now - wakeHandled < 300) return;   // 同一手势只建立一次焦点 / 只发一次请求
                    wakeHandled = now;
                    /* v1.23：手机端与电视端一致——按到搜索框就先清掉上一次的关键词，
                       免得上一次的词还挂着、接着往下打字变成"旧词+新词"。
                       只在"从没焦点到进入该框"时清；键盘已开着、只是点框内挪光标不动值。 */
                    try{
                        if(document.activeElement !== kwBox && kwBox.value){
                            kwBox.value = '';
                            kwBox.setSelectionRange(0, 0);
                        }
                    }catch(e0){}
                    try{
                        // 不要放进 setTimeout：脱离手势栈后 WebView 不会弹键盘。
                        // 已聚焦就别再 focus：重复 focus 会重建 InputConnection 并触发重排。
                        if(document.activeElement !== kwBox) kwBox.focus({preventScroll:true});
                    }catch(e){ try{ kwBox.focus(); }catch(e2){} }
                    kbSession = true;
                    showKb();
                }
                kwBox.addEventListener('pointerdown', wakeInput, false);
                kwBox.addEventListener('touchend', wakeInput, false);    // 只派发 touchend 的 WebView
                kwBox.addEventListener('click', wakeInput, false);       // 只派发 click 的定制 WebView
                kwBox.addEventListener('focus', function(){
                    if(isTv) return;
                    if(!userActed) return;  // 系统/WebView 自动聚焦：不是用户意图，不弹键盘
                    if(Date.now() - wakeHandled < 300) return;   // 手势栈已处理，别重复排程
                    // 只有 focus 事件、没有任何按下事件的定制 WebView：这里兜底一次
                    wakeHandled = Date.now();
                    kbSession = true;
                    showKb();
                }, false);
            }
            /* v1.17：删除原「600ms 后若 userActed 为 false 就 blur 输入框」的兜底。
               它在用户启动后 600ms 内首次点输入框时，会把用户刚点出来的焦点清掉并收起键盘
               （某些 WebView 的 userActed 尚未置位），正是「点了没反应」的元凶之一。
               防系统自动聚焦弹键盘已由 focus 监听里的 if(!userActed) return 完成，无需 blur。 */
            loadStartSong();
            // 补放冷启动抢跑期间被丢弃的遥控器按键（详见 pendingRemote）
            if(pendingRemote !== null){
                var pr = pendingRemote;
                pendingRemote = null;
                window.__remote(pr);
            }
        });
    </script>
</body>
</html>
